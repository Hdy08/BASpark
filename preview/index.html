<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
            letter-spacing: 0;
        }

        html,
        body,
        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        }

        #previewPanel,
        #previewError {
            display: none;
        }

        html.preview,
        html.preview body {
            background: var(--preview-background, #000000);
        }

        html.preview #sparkCanvas {
            z-index: 2;
            pointer-events: auto;
            touch-action: none;
            cursor: crosshair;
        }

        html.preview #previewPanel {
            position: fixed;
            z-index: 4;
            top: 12px;
            right: 12px;
            bottom: 12px;
            display: block;
            width: 314px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid rgba(101, 130, 141, 0.42);
            border-radius: 6px;
            color: #edf5f7;
            background: rgba(24, 34, 39, 0.94);
            box-shadow: 0 12px 34px rgba(14, 24, 28, 0.3);
            pointer-events: auto;
        }

        html.preview #previewPanel *,
        html.preview #previewError * {
            pointer-events: auto;
        }

        .preview-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 30px;
            margin-bottom: 10px;
        }

        .preview-panel-header h1 {
            font-size: 15px;
            font-weight: 650;
        }

        .preview-panel-actions {
            display: flex;
            gap: 6px;
        }

        .preview-command {
            min-height: 28px;
            padding: 0 9px;
            border: 1px solid #50707c;
            border-radius: 4px;
            color: #dce9ed;
            background: #263940;
            cursor: pointer;
            font-size: 11px;
        }

        .preview-command:hover {
            border-color: #5fc5ff;
            color: #ffffff;
        }

        .preview-section {
            padding: 11px 0 6px;
            border-top: 1px solid rgba(169, 195, 204, 0.18);
        }

        .preview-section h2 {
            margin-bottom: 10px;
            color: #8fd8fb;
            font-size: 11px;
            font-weight: 650;
            text-transform: uppercase;
        }

        .preview-control {
            display: grid;
            grid-template-columns: 92px minmax(90px, 1fr) 48px;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            margin-bottom: 5px;
            color: #c8d7dc;
            font-size: 11px;
        }

        .preview-control output {
            color: #ffffff;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        #previewBackgroundColorValue {
            font-size: 10px;
        }

        .preview-control input[type="range"] {
            width: 100%;
            accent-color: #5fc5ff;
        }

        .preview-control input[type="color"] {
            width: 44px;
            height: 26px;
            border: 1px solid #50707c;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
        }

        .preview-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            color: #c8d7dc;
            font-size: 11px;
        }

        .preview-toggle input {
            width: 16px;
            height: 16px;
            accent-color: #5fc5ff;
        }

        #previewSplitSpeeds[hidden],
        #previewUnifiedSpeed[hidden],
        #previewRefreshControl[hidden] {
            display: none;
        }

        #previewError {
            position: fixed;
            z-index: 6;
            left: 50%;
            top: 50%;
            width: min(420px, calc(100% - 32px));
            padding: 16px;
            transform: translate(-50%, -50%);
            border: 1px solid #d46a62;
            border-radius: 6px;
            color: #ffffff;
            background: rgba(44, 28, 29, 0.96);
            font-size: 12px;
            pointer-events: auto;
        }

        html.preview.render-error #previewError {
            display: block;
        }

        @media (max-width: 760px) {
            html.preview #previewPanel {
                top: auto;
                left: 8px;
                right: 8px;
                bottom: 8px;
                width: auto;
                max-height: 46vh;
            }

            .preview-control {
                grid-template-columns: 86px minmax(80px, 1fr) 44px;
            }
        }
    </style>
</head>
<body>
    <canvas id="sparkCanvas"></canvas>
    <aside id="previewPanel" aria-label="视觉表现设置">
        <header class="preview-panel-header">
            <h1>视觉表现</h1>
            <div class="preview-panel-actions">
                <button id="previewReset" class="preview-command" type="button">恢复默认</button>
            </div>
        </header>
        <section class="preview-section">
            <h2>画面</h2>
            <label class="preview-control">
                <span>背景颜色</span>
                <input id="previewBackgroundColor" type="color" value="#000000">
                <output id="previewBackgroundColorValue">#000000</output>
            </label>
            <label class="preview-control">
                <span>主题颜色</span>
                <input id="previewColor" type="color" value="#5fc5ff">
                <output id="previewColorValue">95,197,255</output>
            </label>
        </section>
        <section class="preview-section">
            <h2>尺寸与合成</h2>
            <label class="preview-control"><span>缩放比例</span><input id="previewScale" type="range" min="0.50" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>拖尾粗细</span><input id="previewThickness" type="range" min="0.50" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>发光强度</span><input id="previewGlow" type="range" min="0.00" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>不透明度</span><input id="previewOpacity" type="range" min="0.10" max="1.00" step="0.10" value="1.00"><output>1.00x</output></label>
        </section>
        <section class="preview-section">
            <h2>动画</h2>
            <label class="preview-toggle"><input id="previewLinkedSpeed" type="checkbox" checked><span>拖尾与点击使用同一速度</span></label>
            <label id="previewUnifiedSpeed" class="preview-control"><span>动画速度</span><input id="previewSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <div id="previewSplitSpeeds" hidden>
                <label class="preview-control"><span>拖尾速度</span><input id="previewTrailSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
                <label class="preview-control"><span>点击速度</span><input id="previewClickSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            </div>
            <label class="preview-control"><span>拖尾延迟倍数</span><input id="previewLifetime" type="range" min="0.00" max="2.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-toggle"><input id="previewFollowRefresh" type="checkbox" checked><span>拖尾刷新率跟随显示器</span></label>
            <label id="previewRefreshControl" class="preview-control" hidden><span>拖尾刷新率</span><input id="previewRefresh" type="range" min="30" max="360" step="10" value="60"><output>60 Hz</output></label>
        </section>
    </aside>
    <div id="previewError" role="alert"><strong>渲染器启动失败</strong><div id="previewErrorMessage"></div></div>

            function smoothTrailPath(source, renderSegmentPx) {

                for (let pass = 0; pass < TRAIL_SMOOTHING_PASSES; pass++) {
                    const refined = [points[0]];

                        const b = points[index + 1];
                        refined.push({
                            x: lerp(a.x, b.x, 0.25),
                            y: lerp(a.y, b.y, 0.25),
                            born: lerp(a.born, b.born, 0.25)
                        });
                        refined.push({
                            x: lerp(a.x, b.x, 0.75),
                            y: lerp(a.y, b.y, 0.75),
                            born: lerp(a.born, b.born, 0.75)
                        });
                    }
                    refined.push(points[points.length - 1]);
                    points = refined;
                }

                const resampled = [points[0]];
                for (let index = 1; index < points.length; index++) {
                    const a = points[index - 1];
                    const b = points[index];
                    const distance = Math.hypot(b.x - a.x, b.y - a.y);
                    const segmentCount = Math.max(1, Math.ceil(distance / renderSegmentPx));
                    for (let segment = 1; segment <= segmentCount; segment++) {
                        const t = segment / segmentCount;
                        resampled.push({
                            x: lerp(a.x, b.x, t),
                            y: lerp(a.y, b.y, t),
                            born: lerp(a.born, b.born, t)

                if (t <= stops[0].t) return stops[0].v;
                for (let index = 1; index < stops.length; index++) {
                    const b = stops[index];
                    if (t <= b.t) {
                        const a = stops[index - 1];
                        const dt = Math.max(0.000001, b.t - a.t);
                        const s = clamp((t - a.t) / dt, 0, 1);
                        if (!Number.isFinite(a.o) || !Number.isFinite(b.i)) return lerp(a.v, b.v, s);
                        const s2 = s * s;
                        const s3 = s2 * s;
                        return (2 * s3 - 3 * s2 + 1) * a.v +
                            (s3 - 2 * s2 + s) * dt * a.o +
                            (-2 * s3 + 3 * s2) * b.v +
                            (s3 - s2) * dt * b.i;

                vec3 sampleBloom(vec2 uv) {
                    vec2 offset = uBloomTexel * (uSampleScale * 0.5);
                    vec3 color = texture(uBloom, uv + offset * vec2(-1.0, -1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2( 1.0, -1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2(-1.0,  1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2( 1.0,  1.0)).rgb;
                    return color * 0.25;
                }
                void main() {
                    vec4 source = texture(uSource, vUv);
                    vec3 bloom = sampleBloom(vUv) * uBloomStrength;
                    vec3 hdr = max(source.rgb + bloom, vec3(0.0));
                    vec3 srgb = linearToSrgb(hdr);
                    float effectCoverage = clamp(max(max(srgb.r, srgb.g), srgb.b), 0.0, 1.0);
                    float sourceCoverage = clamp(source.a, 0.0, 1.0);
                    float alpha = 1.0 - (1.0 - sourceCoverage) * (1.0 - effectCoverage);
                    outColor = vec4(min(srgb, vec3(alpha)), alpha);
                }`;

            class WebGlRenderer {
                constructor(canvas, engine, images) {
                    this.canvas = canvas;
                    this.engine = engine;
                    this.gl = canvas.getContext("webgl2", {
                        alpha: true,
                        antialias: false,
                        depth: false,
                        stencil: false,
                        premultipliedAlpha: true,
                        preserveDrawingBuffer: false,
                        powerPreference: "high-performance"
                    });
                    if (!this.gl) throw new Error("WebGL2 is unavailable");
                    this.floatTargets = Boolean(this.gl.getExtension("EXT_color_buffer_float"));
                    this.floatLinear = Boolean(this.gl.getExtension("OES_texture_float_linear"));
                    if (!this.floatLinear) this.floatTargets = false;
                    this.cssWidth = 1;
                    this.cssHeight = 1;
                    this.dpr = 1;
                    this.targets = [];
                    this.msaaTargets = [];
                    this.sourceMsaaTarget = null;
                    this.msaaSamples = 1;
                    this.initPrograms();
                    this.initBuffers();
                    this.textures = {
                        circle: this.createImageTexture(images.circle),
                        ring: this.createImageTexture(images.ring),
                        trail: this.createImageTexture(images.trail),
                        triangle: this.createImageTexture(images.triangle)
                    };
                    this.resize();
                }

                initPrograms() {
                    const gl = this.gl;
                    this.spriteProgram = createProgram(gl, SPRITE_VERTEX, SPRITE_FRAGMENT);
                    this.geometryProgram = createProgram(gl, GEOMETRY_VERTEX, GEOMETRY_FRAGMENT);
                    this.prefilterProgram = createProgram(gl, FULLSCREEN_VERTEX, PREFILTER_FRAGMENT);
                    this.downsampleProgram = createProgram(gl, FULLSCREEN_VERTEX, DOWNSAMPLE_FRAGMENT);
                    this.upsampleProgram = createProgram(gl, FULLSCREEN_VERTEX, UPSAMPLE_FRAGMENT);
                    this.finalProgram = createProgram(gl, FULLSCREEN_VERTEX, FINAL_FRAGMENT);
                }

                initBuffers() {
                    const gl = this.gl;
                    this.spriteVao = gl.createVertexArray();
                    gl.bindVertexArray(this.spriteVao);
                    const quad = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                        -0.5, -0.5, 0.5, -0.5, -0.5, 0.5,
                        -0.5, 0.5, 0.5, -0.5, 0.5, 0.5
                    ]), gl.STATIC_DRAW);
                    gl.enableVertexAttribArray(0);
                    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);

                    this.geometryVao = gl.createVertexArray();
                    this.geometryBuffer = gl.createBuffer();
                    gl.bindVertexArray(this.geometryVao);
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.geometryBuffer);
                    gl.enableVertexAttribArray(0);
                    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 32, 0);
                    gl.enableVertexAttribArray(1);
                    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 32, 8);
                    gl.enableVertexAttribArray(2);
                    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);

                    this.fullscreenVao = gl.createVertexArray();
                    gl.bindVertexArray(null);
                }

                createImageTexture(image) {
                    const gl = this.gl;
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, image);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    return texture;
                }

                createTarget(width, height) {
                    const gl = this.gl;
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    const internalFormat = this.floatTargets ? gl.RGBA16F : gl.RGBA8;
                    const type = this.floatTargets ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
                    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, gl.RGBA, type, null);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    const framebuffer = gl.createFramebuffer();
                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                        throw new Error("Touch effect framebuffer is incomplete");
                    }
                    const target = { texture, framebuffer, width, height };
                    this.targets.push(target);
                    return target;
                }

                createMultisampleTarget(width, height) {
                    const gl = this.gl;
                    const samples = Math.min(
                        TRAIL_MSAA_SAMPLES,
                        Math.max(1, Number(gl.getParameter(gl.MAX_SAMPLES)) || 1)
                    );
                    if (samples < 2) return null;

                    const framebuffer = gl.createFramebuffer();
                    const colorBuffer = gl.createRenderbuffer();
                    if (!framebuffer || !colorBuffer) return null;

                    const internalFormat = this.floatTargets ? gl.RGBA16F : gl.RGBA8;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
                    gl.bindRenderbuffer(gl.RENDERBUFFER, colorBuffer);
                    gl.renderbufferStorageMultisample(
                        gl.RENDERBUFFER,
                        samples,
                        internalFormat,
                        width,
                        height
                    );
                    gl.framebufferRenderbuffer(
                        gl.FRAMEBUFFER,
                        gl.COLOR_ATTACHMENT0,
                        gl.RENDERBUFFER,
                        colorBuffer
                    );
                    const complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
                    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    if (!complete) {
                        gl.deleteRenderbuffer(colorBuffer);
                        gl.deleteFramebuffer(framebuffer);
                        return null;
                    }

                    const target = { framebuffer, colorBuffer, width, height, samples };
                    this.msaaTargets.push(target);
                    return target;
                }

                deleteTargets() {
                    const gl = this.gl;
                    for (const target of this.targets) {
                        gl.deleteFramebuffer(target.framebuffer);
                        gl.deleteTexture(target.texture);
                    }
                    this.targets.length = 0;
                    for (const target of this.msaaTargets) {
                        gl.deleteRenderbuffer(target.colorBuffer);
                        gl.deleteFramebuffer(target.framebuffer);
                    }
                    this.msaaTargets.length = 0;
                    this.sourceMsaaTarget = null;
                    this.msaaSamples = 1;
                }

                resize() {
                    const width = Math.max(1, window.innerWidth);
                    const height = Math.max(1, window.innerHeight);
                    const minimumDpr = width * height <= 3000000 ? 1.25 : 1;
                    const dpr = clamp(Math.max(window.devicePixelRatio || 1, minimumDpr), 1, 2);
                    const pixelWidth = Math.max(1, Math.round(width * dpr));
                    const pixelHeight = Math.max(1, Math.round(height * dpr));
                    if (this.canvas.width === pixelWidth && this.canvas.height === pixelHeight &&
                        this.cssWidth === width && this.cssHeight === height) return;

                    this.cssWidth = width;
                    this.cssHeight = height;
                    this.dpr = dpr;
                    this.canvas.width = pixelWidth;
                    this.canvas.height = pixelHeight;
                    this.deleteTargets();
                    this.sourceTarget = this.createTarget(pixelWidth, pixelHeight);
                    this.sourceMsaaTarget = this.createMultisampleTarget(pixelWidth, pixelHeight);
                    this.msaaSamples = this.sourceMsaaTarget?.samples || 1;
                    this.downTargets = [];
                    this.upTargets = [];
                    let levelWidth = Math.max(1, Math.floor(pixelWidth / 2));
                    let levelHeight = Math.max(1, Math.floor(pixelHeight / 2));
                    const bloomLogs = Math.log2(Math.max(levelWidth, levelHeight)) + BLOOM_DIFFUSION - 10;
                    const bloomFloor = Math.floor(bloomLogs);
                    const maximumBloomLogs = bloomLogs +
                        Math.log2(BLOOM_RADIUS_CALIBRATION * Math.sqrt(3));
                    const bloomLevels = clamp(Math.ceil(maximumBloomLogs), 1, MAX_BLOOM_LEVELS);
                    this.bloomLogs = bloomLogs;
                    this.activeBloomLevels = clamp(bloomFloor, 1, bloomLevels);
                    this.bloomSampleScale = 0.5 + bloomLogs - bloomFloor;
                    for (let level = 0; level < bloomLevels; level++) {
                        this.downTargets.push(this.createTarget(levelWidth, levelHeight));
                        this.upTargets.push(this.createTarget(levelWidth, levelHeight));
                        if (levelWidth <= 2 || levelHeight <= 2) break;
                        levelWidth = Math.max(1, Math.floor(levelWidth / 2));
                        levelHeight = Math.max(1, Math.floor(levelHeight / 2));
                    }
                    this.engine.resize(width, height);
                }

                bloomParameters(glowControl) {
                    if (glowControl <= 0) {
                        return { levels: 0, sampleScale: 0, radiusScale: 0 };
                    }
                    const radiusScale = BLOOM_RADIUS_CALIBRATION * Math.sqrt(glowControl);
                    const bloomLogs = this.bloomLogs + Math.log2(radiusScale);
                    const bloomFloor = Math.floor(bloomLogs);
                    return {
                        levels: clamp(bloomFloor, 1, this.downTargets.length),
                        sampleScale: 0.5 + bloomLogs - bloomFloor,
                        radiusScale
                    };
                }

                clearTarget(target = null) {
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
                    gl.viewport(0, 0, target ? target.width : this.canvas.width, target ? target.height : this.canvas.height);
                    gl.clearColor(0, 0, 0, 0);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                }

                setAdditiveBlend() {
                    const gl = this.gl;
                    gl.enable(gl.BLEND);
                    gl.blendEquation(gl.FUNC_ADD);
                    gl.blendFunc(gl.ONE, gl.ONE);
                }

                setPremultipliedBlend() {
                    const gl = this.gl;
                    gl.enable(gl.BLEND);
                    gl.blendEquation(gl.FUNC_ADD);
                    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
                }

                drawSprite(texture, x, y, width, height, rotation, color, alpha, gain, uvRect = [0, 0, 1, 1]) {
                    if (width <= 0.02 || height <= 0.02 || alpha <= 0.0001) return;
                    const gl = this.gl;
                    const program = this.spriteProgram;
                    gl.useProgram(program);
                    gl.bindVertexArray(this.spriteVao);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, "uTexture"), 0);
                    gl.uniform2f(gl.getUniformLocation(program, "uCenter"), x, y);
                    gl.uniform2f(gl.getUniformLocation(program, "uSize"), width, height);
                    gl.uniform2f(gl.getUniformLocation(program, "uResolution"), this.cssWidth, this.cssHeight);
                    gl.uniform4f(gl.getUniformLocation(program, "uUvRect"), ...uvRect);
                    gl.uniform1f(gl.getUniformLocation(program, "uRotation"), rotation);
                    const linear = linearColor(color);
                    gl.uniform3f(gl.getUniformLocation(program, "uColor"), linear[0], linear[1], linear[2]);
                    gl.uniform1f(gl.getUniformLocation(program, "uAlpha"), clamp(alpha * this.engine.opacity, 0, 1));
                    gl.uniform1f(gl.getUniformLocation(program, "uGain"), gain);
                    gl.drawArrays(gl.TRIANGLES, 0, 6);
                }

                drawGeometry(texture, vertices, gain) {
                    if (vertices.length < 24) return;
                    const gl = this.gl;
                    const program = this.geometryProgram;
                    gl.useProgram(program);
                    gl.bindVertexArray(this.geometryVao);
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.geometryBuffer);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.DYNAMIC_DRAW);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, "uTexture"), 0);
                    gl.uniform2f(gl.getUniformLocation(program, "uResolution"), this.cssWidth, this.cssHeight);
                    gl.uniform1f(gl.getUniformLocation(program, "uGain"), gain);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, vertices.length / 8);
                }

                pushGeometryVertex(vertices, x, y, u, v, color, alpha) {
                    const linear = linearColor(color);
                    vertices.push(x, y, u, v, linear[0], linear[1], linear[2], clamp(alpha * this.engine.opacity, 0, 1));
                }

                meshAngularVelocity(p, blend) {
                    const min = evalCurve(PROFILE.mesh.rotationMin, p, 1);
                    const max = evalCurve(PROFILE.mesh.rotationMax, p, 0.8);
                    return lerp(min, max, blend) * PROFILE.mesh.rotationScalar;
                }

                meshRotation(p, blend) {
                    const steps = 24;
                    const h = p / steps;
                    let integral = this.meshAngularVelocity(0, blend) + this.meshAngularVelocity(p, blend);
                    for (let index = 1; index < steps; index++) {
                        integral += this.meshAngularVelocity(index * h, blend) * (index % 2 === 0 ? 2 : 4);
                    }
                    return -integral * h / 3 * PROFILE.mesh.lifetimeMs / 1000;
                }

                renderDisc(click, now) {
                    const p = (now - click.born) * this.engine.clickSpeed / PROFILE.disc.lifetimeMs;
                    if (p < 0 || p >= 1) return;
                    const curve = Math.max(0, evalCurve(PROFILE.disc.sizeCurve, p)) * PROFILE.disc.sizeMultiplier;
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const size = PROFILE.disc.size * this.engine.worldToPx * curve * effectiveScale;
                    const color = this.engine.displayColor(evalColor(PROFILE.disc.color, p));
                    const alpha = evalCurve(PROFILE.disc.alpha, p);
                    this.setPremultipliedBlend();
                    this.drawSprite(this.textures.circle, click.x, click.y, size, size, 0, color, alpha, DISC_HDR);
                }

                renderTriangle(particle, now, speed) {
                    const ageMs = (now - particle.born) * speed;
                    const p = ageMs / particle.lifetimeMs;
                    if (p < 0 || p >= 1) return;
                    const curve = Math.max(0, evalCurve(PROFILE.triangleSize, p));
                    const travelled = particle.speed * ageMs / 1000;
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const radius = particle.localScale * this.engine.worldToPx *
                        (particle.shapeScale + travelled) * effectiveScale;
                    const x = particle.x + Math.cos(particle.direction) * radius;
                    const y = particle.y + Math.sin(particle.direction) * radius;
                    const size = particle.size * particle.localScale * this.engine.worldToPx * curve * effectiveScale;
                    const color = this.engine.displayColor(evalColor(PROFILE.triangleColor, p));
                    const alpha = evalCurve(PROFILE.triangleAlpha, p) * particle.brightness;
                    this.setAdditiveBlend();
                    this.drawSprite(
                        this.textures.triangle,
                        x,
                        y,
                        size,
                        size,
                        0,
                        color,
                        alpha,
                        PARTICLE_HDR,
                        [particle.frame * 0.5, 0, 0.5, 1]
                    );
                }

                renderArc(click, arc, now) {
                    const p = (now - click.born) * this.engine.clickSpeed / PROFILE.mesh.lifetimeMs;
                    if (p < 0 || p >= 1) return;
                    const curve = Math.max(0, evalCurve(PROFILE.mesh.sizeCurve, p));
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const inner = arc.startSize * this.engine.worldToPx * curve * effectiveScale;
                    const outer = inner * PROFILE.mesh.outerRadius;
                    const length = TAU * clamp(1 - evalCurve(PROFILE.mesh.custom, p), 0, 1);
                    if (length < 0.015 || inner <= 0.01) return;
                    const start = arc.angle + this.meshRotation(p, arc.rotationMix);
                    const color = this.engine.displayColor(evalColor(PROFILE.mesh.color, p));
                    const segments = Math.max(2, Math.ceil(64 * length / TAU));
                    const vertices = [];
                    for (let index = 0; index <= segments; index++) {
                        const progress = index / segments;
                        const angle = start + length * progress;
                        const cos = Math.cos(angle);
                        const sin = Math.sin(angle);
                        const u = 1 - progress;
                        this.pushGeometryVertex(vertices, click.x + cos * inner, click.y + sin * inner, u, 0, color, 1);
                        this.pushGeometryVertex(vertices, click.x + cos * outer, click.y + sin * outer, u, 1, color, 1);
                    }
                    this.setAdditiveBlend();
                    this.drawGeometry(this.textures.ring, vertices, PARTICLE_HDR);
                }

                renderTrail(now) {
                    const strokes = this.engine.trailStrokes(now);
                    const halfWidth = TRAIL_WIDTH_WORLD * this.engine.worldToPx *
                        this.engine.trailThickness * TRAIL_RENDER_WIDTH_SCALE * 0.5;
                    if (halfWidth <= 0 || strokes.length === 0) return;
                    this.setAdditiveBlend();
                    for (const sourcePoints of strokes) {
                        const points = smoothTrailPath(
                            sourcePoints,
                            TRAIL_RENDER_SEGMENT_PX / Math.max(1, this.dpr)
                        );
                        const lengths = new Float32Array(points.length);
                        let total = 0;
                        for (let index = 1; index < points.length; index++) {
                            total += Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y);
                            lengths[index] = total;
                        }
                        if (total < 0.05) continue;
                        const vertices = [];
                        const appendPair = (point, nx, ny, offset, progress) => {
                            const color = this.engine.displayColor(evalColor(PROFILE.trailColor, progress));
                            const u = 1 - progress;
                            this.pushGeometryVertex(vertices, point.x + nx * offset, point.y + ny * offset, u, 0, color, 1);
                            this.pushGeometryVertex(vertices, point.x - nx * offset, point.y - ny * offset, u, 1, color, 1);
                        };
                        const segmentNormal = index => {
                            const a = points[index];
                            const b = points[index + 1];
                            const dx = b.x - a.x;
                            const dy = b.y - a.y;
                            const length = Math.max(0.0001, Math.hypot(dx, dy));
                            return { x: -dy / length, y: dx / length, tx: dx / length, ty: dy / length };
                        };

                        const firstNormal = segmentNormal(0);
                        appendPair({
                            x: points[0].x - firstNormal.tx * halfWidth,
                            y: points[0].y - firstNormal.ty * halfWidth
                        }, firstNormal.x, firstNormal.y, halfWidth, 0);
                        appendPair(points[0], firstNormal.x, firstNormal.y, halfWidth, 0);

                        for (let index = 1; index < points.length - 1; index++) {
                            const point = points[index];
                            const progress = lengths[index] / total;
                            const before = segmentNormal(index - 1);
                            const after = segmentNormal(index);
                            let mx = before.x + after.x;
                            let my = before.y + after.y;
                            const miterLength = Math.hypot(mx, my);
                            if (miterLength < 0.0001) {
                                mx = after.x;
                                my = after.y;
                            } else {
                                mx /= miterLength;
                                my /= miterLength;
                            }
                            const alignment = Math.max(0.5, Math.abs(mx * after.x + my * after.y));
                            const offset = Math.min(halfWidth * 2, halfWidth / alignment);
                            appendPair(point, mx, my, offset, progress);
                        }

                        const lastIndex = points.length - 1;
                        const lastNormal = segmentNormal(lastIndex - 1);
                        appendPair(points[lastIndex], lastNormal.x, lastNormal.y, halfWidth, 1);
                        appendPair({
                            x: points[lastIndex].x + lastNormal.tx * halfWidth,
                            y: points[lastIndex].y + lastNormal.ty * halfWidth
                        }, lastNormal.x, lastNormal.y, halfWidth, 1);
                        this.drawGeometry(this.textures.trail, vertices, TRAIL_HDR);
                    }
                }

                renderSource(now) {
                    const gl = this.gl;
                    const renderTarget = this.sourceMsaaTarget || this.sourceTarget;
                    this.clearTarget(renderTarget);
                    gl.disable(gl.DEPTH_TEST);
                    gl.disable(gl.CULL_FACE);
                    this.renderTrail(now);
                    for (const click of this.engine.clicks) this.renderDisc(click, now);
                    for (const click of this.engine.clicks) {
                        for (const arc of click.arcs) this.renderArc(click, arc, now);
                    }
                    for (const particle of this.engine.distanceParticles) {
                        this.renderTriangle(particle, now, this.engine.trailSpeed);
                    }
                    for (const click of this.engine.clicks) {
                        for (const particle of click.triangles) {
                            this.renderTriangle(particle, now, this.engine.clickSpeed);
                        }
                    }
                    this.resolveSourceMultisample();
                }

                resolveSourceMultisample() {
                    if (!this.sourceMsaaTarget) return;
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.sourceMsaaTarget.framebuffer);
                    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.sourceTarget.framebuffer);
                    gl.blitFramebuffer(
                        0,
                        0,
                        this.sourceMsaaTarget.width,
                        this.sourceMsaaTarget.height,
                        0,
                        0,
                        this.sourceTarget.width,
                        this.sourceTarget.height,
                        gl.COLOR_BUFFER_BIT,
                        gl.NEAREST
                    );
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                }

                bindFullscreenTexture(program, name, unit, texture) {
                    const gl = this.gl;
                    gl.activeTexture(gl.TEXTURE0 + unit);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, name), unit);
                }

                drawFullscreen(program, target) {
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
                    gl.viewport(0, 0, target ? target.width : this.canvas.width, target ? target.height : this.canvas.height);
                    gl.useProgram(program);
                    gl.bindVertexArray(this.fullscreenVao);
                    gl.drawArrays(gl.TRIANGLES, 0, 3);
                }

                renderBloom(levelCount, sampleScale) {
                    const gl = this.gl;
                    gl.disable(gl.BLEND);
                    let source = this.sourceTarget;
                    for (let level = 0; level < levelCount; level++) {
                        const target = this.downTargets[level];
                        const program = level === 0 ? this.prefilterProgram : this.downsampleProgram;
                        gl.useProgram(program);
                        this.bindFullscreenTexture(program, "uTexture", 0, source.texture);
                        gl.uniform2f(gl.getUniformLocation(program, "uTexel"), 1 / source.width, 1 / source.height);
                        if (level === 0) gl.uniform1f(
                            gl.getUniformLocation(program, "uThreshold"),
                            BLOOM_THRESHOLD
                        );
                        this.clearTarget(target);
                        this.drawFullscreen(program, target);
                        source = target;
                    }

                    let low = this.downTargets[levelCount - 1];
                    for (let level = levelCount - 2; level >= 0; level--) {
                        const high = this.downTargets[level];
                        const target = this.upTargets[level];
                        const program = this.upsampleProgram;
                        gl.useProgram(program);
                        this.bindFullscreenTexture(program, "uHigh", 0, high.texture);
                        this.bindFullscreenTexture(program, "uLow", 1, low.texture);
                        gl.uniform2f(gl.getUniformLocation(program, "uLowTexel"), 1 / low.width, 1 / low.height);
                        gl.uniform1f(
                            gl.getUniformLocation(program, "uSampleScale"),
                            sampleScale
                        );
                        this.clearTarget(target);
                        this.drawFullscreen(program, target);
                        low = target;
                    }
                    return low;
                }

                render(now) {
                    this.resize();
                    this.engine.prune(now);
                    this.renderSource(now);
                    const glowControl = clamp(this.engine.glowIntensity, 0, 3);
                    const bloomParameters = this.bloomParameters(glowControl);
                    this.activeBloomLevels = bloomParameters.levels;
                    this.bloomSampleScale = bloomParameters.sampleScale;
                    const bloom = glowControl > 0
                        ? this.renderBloom(bloomParameters.levels, bloomParameters.sampleScale)
                        : this.sourceTarget;
                    const gl = this.gl;
                    gl.disable(gl.BLEND);
                    gl.useProgram(this.finalProgram);
                    this.bindFullscreenTexture(this.finalProgram, "uSource", 0, this.sourceTarget.texture);
                    this.bindFullscreenTexture(this.finalProgram, "uBloom", 1, bloom.texture);
                    gl.uniform1f(
                        gl.getUniformLocation(this.finalProgram, "uBloomStrength"),
                        BLOOM_BASE_STRENGTH * glowControl
                    );
                    gl.uniform2f(
                        gl.getUniformLocation(this.finalProgram, "uBloomTexel"),
                        1 / bloom.width,
                        1 / bloom.height
                    );
                    gl.uniform1f(
                        gl.getUniformLocation(this.finalProgram, "uSampleScale"),
                        bloomParameters.sampleScale
                    );
                    this.clearTarget(null);
                    this.drawFullscreen(this.finalProgram, null);
                }

                clear() {
                    this.clearTarget(null);
                }
            }

            const fallbackAssetBase = "../../apk/.touch_effect_inventory/candidates/textures/";
            const assetNames = {
                circle: "FX_TEX_Circle_01.png",
                ring: "FX_TEX_Grad_Ring3.png",
                trail: "FX_TEX_Trail_03.png",
                triangle: "FX_TEX_Triangle_02_1.png"
            };

            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.decoding = "async";
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error(`Unable to load touch effect asset: ${url}`));
                    image.src = url;
                });
            }

            async function loadAssets() {
                const injected = window.__BASPARK_ASSETS || {};
                const entries = await Promise.all(Object.entries(assetNames).map(async ([key, name]) => {
                    const url = injected[key] || fallbackAssetBase + name;
                    return [key, await loadImage(url)];
                }));
                return Object.fromEntries(entries);
            }

            const canvas = document.getElementById("sparkCanvas");
            const engine = new TouchEngine();
            engine.resize(window.innerWidth, window.innerHeight);
            window.spark = engine;
            window.renderingPaused = false;
            window.currentInputMode = "mouse";
            window.enableAlwaysTrailEffect = false;
            window.effectiveAlwaysTrail = false;
            window.previewReady = false;
            let renderer = null;
            let frameId = null;
            let lastBoom = { x: Number.NaN, y: Number.NaN, time: -Infinity };
            let lastMove = { x: Number.NaN, y: Number.NaN };

            function debugState() {
                const worldToPx = engine.worldToPx;
                return {
                    ready: window.previewReady,
                    backend: renderer ? "webgl2" : "loading",
                    hdr: renderer?.floatTargets ? "rgba16f" : "rgba8",
                    width: engine.width,
                    height: engine.height,
                    worldToPx,
                    clickCount: engine.clicks.length,
                    distanceParticleCount: engine.distanceParticles.length,
                    trailPointCount: engine.trail.length,
                    trailHasLiveTip: Boolean(engine.trailTip),
                    trailWidthPx: TRAIL_WIDTH_WORLD * worldToPx * engine.trailThickness *
                        TRAIL_RENDER_WIDTH_SCALE,
                    trailMinVertexDistancePx: TRAIL_MIN_VERTEX_WORLD * worldToPx,
                    trailLifetimeMs: TRAIL_LIFETIME_MS * engine.trailLifetimeMultiplier,
                    scale: engine.scale,
                    effectiveScale: engine.scale * EFFECT_RENDER_SCALE,
                    opacity: engine.opacity,
                    trailSpeed: engine.trailSpeed,
                    clickSpeed: engine.clickSpeed,
                    trailThickness: engine.trailThickness,
                    trailLifetimeMultiplier: engine.trailLifetimeMultiplier,
                    trailRefreshRate: engine.trailRefreshRate,
                    glowIntensity: engine.glowIntensity,
                    bloomResourceIntensity: BLOOM_RESOURCE_INTENSITY,
                    bloomIntensity: BLOOM_BASE_STRENGTH * engine.glowIntensity,
                    bloomLevels: renderer?.activeBloomLevels || 0,
                    bloomSampleScale: renderer?.bloomSampleScale || 0,
                    antialiasSamples: renderer?.msaaSamples || 1,
                    bloomRadiusScale: BLOOM_RADIUS_CALIBRATION *
                        Math.sqrt(clamp(engine.glowIntensity, 0, 3)),
                    color: engine.colorText,
                    nativeTheme: engine.nativeTheme,
                    error: window.__BASPARK_RENDER_ERROR__ || null
                };
            }

            Object.defineProperty(window, "__BASPARK_DEBUG__", { get: debugState });

            function renderFrame(time = engine.now()) {
                if (!renderer || window.renderingPaused) return;
                renderer.render(time);
            }

            function animationFrame(time) {
                frameId = null;
                if (window.renderingPaused || !renderer) return;
                renderFrame(time);
                if (engine.hasActiveEffects(time)) {
                    frameId = requestAnimationFrame(animationFrame);
                }
            }

            window.scheduleNextAnimationFrame = () => {
                if (!window.renderingPaused && renderer && frameId == null) {
                    frameId = requestAnimationFrame(animationFrame);
                }
            };

            window.setInputContext = (mode, alwaysTrailEnabled) => {
                window.currentInputMode = mode === "touch" ? "touch" : "mouse";
                window.enableAlwaysTrailEffect = Boolean(alwaysTrailEnabled);
                window.effectiveAlwaysTrail = window.currentInputMode === "mouse" && window.enableAlwaysTrailEffect;
            };

            window.externalBoom = (percentX, percentY) => {
                if (window.renderingPaused) return;
                const now = engine.now();
                if (percentX === lastBoom.x && percentY === lastBoom.y && now - lastBoom.time < 25) return;
                lastBoom = { x: percentX, y: percentY, time: now };
                engine.pointerDown(percentX * window.innerWidth, percentY * window.innerHeight, now);
                window.scheduleNextAnimationFrame();
            };

            window.externalMove = (percentX, percentY) => {
                if (window.renderingPaused) return;
                if (percentX === lastMove.x && percentY === lastMove.y) return;
                lastMove = { x: percentX, y: percentY };
                engine.pointerMove(percentX * window.innerWidth, percentY * window.innerHeight, engine.now());
                window.scheduleNextAnimationFrame();
            };

            window.externalTrailStart = (percentX, percentY, pointerDown) => {
                if (window.renderingPaused) return;
                lastMove = { x: percentX, y: percentY };
                engine.beginTrailStrokeOnly(
                    percentX * window.innerWidth,
                    percentY * window.innerHeight,
                    pointerDown,
                    engine.now()
                );
                window.scheduleNextAnimationFrame();
            };

            window.externalUp = () => {
                if (window.renderingPaused) return;
                engine.pointerUp();
                window.scheduleNextAnimationFrame();
            };

            window.updateColor = rgbString => {
                engine.setColor(rgbString);
                window.scheduleNextAnimationFrame();
            };

            window.updateEffectSettings = (
                scale,
                opacity,
                trailSpeed,
                clickSpeed,
                trailThickness,
                trailLifetimeMultiplier,
                glowIntensity
            ) => {
                const finite = (value, fallback) => Number.isFinite(Number(value)) ? Number(value) : fallback;
                engine.scale = clamp(finite(scale, 1), 0.5, 3);
                engine.opacity = clamp(finite(opacity, 1), 0.1, 1);
                engine.trailSpeed = clamp(finite(trailSpeed, 1), 0.2, 3);
                engine.clickSpeed = clamp(finite(clickSpeed, 1), 0.2, 3);
                engine.trailThickness = clamp(finite(trailThickness, 1), 0.5, 3);
                engine.trailLifetimeMultiplier = clamp(finite(trailLifetimeMultiplier, 1), 0, 2);
                engine.glowIntensity = clamp(finite(glowIntensity, 1), 0, 3);
                window.scheduleNextAnimationFrame();
            };

            window.updateTrailRefreshRate = hz => {
                engine.trailRefreshRate = clamp(Math.round(Number(hz) || 60), 30, 360);
            };

            window.clearEffects = () => {
                if (frameId != null) cancelAnimationFrame(frameId);
                frameId = null;
                engine.clear();
                renderer?.clear();
                lastBoom = { x: Number.NaN, y: Number.NaN, time: -Infinity };
                lastMove = { x: Number.NaN, y: Number.NaN };
            };

            window.truncateTrail = () => {
                engine.truncateTrail();
                lastMove = { x: Number.NaN, y: Number.NaN };
                window.scheduleNextAnimationFrame();
            };

            window.setRenderingPaused = paused => {
                window.renderingPaused = Boolean(paused);
                window.clearEffects();
                if (!window.renderingPaused) {
                    window.scheduleNextAnimationFrame();
                }
            };

            window.renderPreviewFrame = milliseconds => {
                engine.testClock = Math.max(0, Number(milliseconds) || 0);
                renderFrame(engine.testClock);
                return debugState();
            };

            function installPreviewMode() {
                if (!IS_PREVIEW) return;
                let pointerDown = false;
                const point = event => ({
                    x: event.clientX / Math.max(1, window.innerWidth),
                    y: event.clientY / Math.max(1, window.innerHeight)
                });
                canvas.addEventListener("pointerdown", event => {
                    pointerDown = true;
                    canvas.setPointerCapture?.(event.pointerId);
                    const p = point(event);
                    window.externalBoom(p.x, p.y);
                });
                canvas.addEventListener("pointermove", event => {
                    if (!pointerDown) return;
                    const p = point(event);
                    window.externalMove(p.x, p.y);
                });
                const release = () => {
                    if (!pointerDown) return;
                    pointerDown = false;
                    window.externalUp();
                };
                canvas.addEventListener("pointerup", release);
                canvas.addEventListener("pointercancel", release);

                const controls = {
                    backgroundColor: document.getElementById("previewBackgroundColor"),
                    backgroundColorValue: document.getElementById("previewBackgroundColorValue"),
                    color: document.getElementById("previewColor"),
                    colorValue: document.getElementById("previewColorValue"),
                    scale: document.getElementById("previewScale"),
                    thickness: document.getElementById("previewThickness"),
                    glow: document.getElementById("previewGlow"),
                    opacity: document.getElementById("previewOpacity"),
                    linkedSpeed: document.getElementById("previewLinkedSpeed"),
                    unifiedSpeedRow: document.getElementById("previewUnifiedSpeed"),
                    speed: document.getElementById("previewSpeed"),
                    splitSpeeds: document.getElementById("previewSplitSpeeds"),
                    trailSpeed: document.getElementById("previewTrailSpeed"),
                    clickSpeed: document.getElementById("previewClickSpeed"),
                    lifetime: document.getElementById("previewLifetime"),
                    followRefresh: document.getElementById("previewFollowRefresh"),
                    refreshRow: document.getElementById("previewRefreshControl"),
                    refresh: document.getElementById("previewRefresh")
                };
                const defaults = {
                    backgroundColor: "#000000",
                    color: "#5fc5ff",
                    scale: "1.00",
                    thickness: "1.00",
                    glow: "1.00",
                    opacity: "1.00",
                    speed: "1.00",
                    trailSpeed: "1.00",
                    clickSpeed: "1.00",
                    lifetime: "1.00",
                    refresh: "60"
                };
                const rangeControls = [
                    [controls.scale, "x", 2],
                    [controls.thickness, "x", 2],
                    [controls.glow, "x", 2],
                    [controls.opacity, "x", 2],
                    [controls.speed, "x", 2],
                    [controls.trailSpeed, "x", 2],
                    [controls.clickSpeed, "x", 2],
                    [controls.lifetime, "x", 2],
                    [controls.refresh, " Hz", 0]
                ];

                const syncRangeOutput = (input, suffix, digits) => {
                    input.nextElementSibling.value = `${Number(input.value).toFixed(digits)}${suffix}`;
                };
                const colorText = () => {
                    const value = controls.color.value.replace("#", "");
                    const rgb = [0, 2, 4].map(offset => Number.parseInt(value.slice(offset, offset + 2), 16));
                    return rgb.join(",");
                };
                const syncConditionalControls = () => {
                    const linked = controls.linkedSpeed.checked;
                    controls.unifiedSpeedRow.hidden = !linked;
                    controls.splitSpeeds.hidden = linked;
                    controls.refreshRow.hidden = controls.followRefresh.checked;
                };
                const applyControls = () => {
                    const linked = controls.linkedSpeed.checked;
                    const trailSpeed = Number(linked ? controls.speed.value : controls.trailSpeed.value);
                    const clickSpeed = Number(linked ? controls.speed.value : controls.clickSpeed.value);
                    document.documentElement.style.setProperty("--preview-background", controls.backgroundColor.value);
                    controls.backgroundColorValue.value = controls.backgroundColor.value.toUpperCase();
                    window.updateColor(colorText());
                    controls.colorValue.value = colorText();
                    window.updateEffectSettings(
                        Number(controls.scale.value),
                        Number(controls.opacity.value),
                        trailSpeed,
                        clickSpeed,
                        Number(controls.thickness.value),
                        Number(controls.lifetime.value),
                        Number(controls.glow.value)
                    );
                    window.updateTrailRefreshRate(Number(controls.refresh.value));
                };
                const resetControls = () => {
                    for (const [name, value] of Object.entries(defaults)) controls[name].value = value;
                    controls.linkedSpeed.checked = true;
                    controls.followRefresh.checked = true;
                    for (const [input, suffix, digits] of rangeControls) syncRangeOutput(input, suffix, digits);
                    syncConditionalControls();
                    applyControls();
                };

                for (const [input, suffix, digits] of rangeControls) {
                    syncRangeOutput(input, suffix, digits);
                    input.addEventListener("input", () => {
                        syncRangeOutput(input, suffix, digits);
                        applyControls();
                    });
                }
                controls.backgroundColor.addEventListener("input", applyControls);
                controls.color.addEventListener("input", applyControls);
                controls.linkedSpeed.addEventListener("change", () => {
                    syncConditionalControls();
                    applyControls();
                });
                controls.followRefresh.addEventListener("change", () => {
                    syncConditionalControls();
                    applyControls();
                });
                document.getElementById("previewReset").addEventListener("click", resetControls);
                syncConditionalControls();
                applyControls();

                window.__BASPARK_PREVIEW_CONTROLS__ = { apply: applyControls, reset: resetControls };
            }

            window.addEventListener("resize", () => {
                renderer?.resize();
                window.scheduleNextAnimationFrame();
            });

            loadAssets().then(images => {
                renderer = new WebGlRenderer(canvas, engine, images);
                window.previewReady = true;
                installPreviewMode();
                window.scheduleNextAnimationFrame();
            }).catch(error => {
                window.__BASPARK_RENDER_ERROR__ = error instanceof Error ? error.message : String(error);
                if (IS_PREVIEW) {
                    document.documentElement.classList.add("render-error");
                    document.getElementById("previewErrorMessage").textContent = window.__BASPARK_RENDER_ERROR__;
                }
                console.error(error);
            });
        })();
    </script>
</body>
</html>
