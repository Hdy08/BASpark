        canvas {

            top: 0;

    <script>
        const UNITY_SIZE_TO_PX = 180.0;
        const UNITY_RATE_DISTANCE_BASE = 5.0;
        const DEFAULT_COLOR = "45,175,255";
        const DEFAULT_COLOR_RGB = [45 / 255, 175 / 255, 1.0];
        const UI_DEFAULT_SCALE = 1.0;
        const TRAIL_BASE_WIDTH_SCALE = 2.0;
        const TRAIL_SMOOTHING_RADIUS_PX = 9.0;
        const TRAIL_TARGET_SEGMENT_PX = 10.0;
        const TRAIL_GLOW_BUFFER_SCALE = 0.5;
        const TRAIL_NEAR_GLOW_BLUR_PX = 2.2;
        const TRAIL_HEAD_GLOW_BLUR_PX = 4.5;
        const TRAIL_TAIL_WIDTH_RATIO = 0.18;
        const TRAIL_RIBBON_SEGMENT_PX = 6.0;
        const TRAIL_RIBBON_MAX_SEGMENTS = 12;
        const TRAIL_MAX_POINTS = 320;
        const TRAIL_COMPACT_TARGET = 256;
        const MAX_TRAIL_SEGMENTS_PER_MOVE = 8;
        const MAX_CLICK_EFFECTS = 16;
        const MAX_CLICK_GLOW_EFFECTS = 6;
        const MAX_CLICK_SHADOW_BLUR_PX = 48;
        const MAX_DISTANCE_EFFECTS = 24;
        const MAX_DISTANCE_EMIT_EVENTS_PER_MOVE = 8;
        const TRAIL_MASK_LUT_SIZE = 128;

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function buildTrailMaskLut() {
            return Array.from({ length: TRAIL_MASK_LUT_SIZE + 1 }, (_, index) => {
                const t = index / TRAIL_MASK_LUT_SIZE;
                return clamp(1.0 - Math.pow(t, 0.62) * 1.55, 0.0, 1.0);
            });
        }

        const TRAIL_MASK_LUT = buildTrailMaskLut();

        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function parseRgb(text, fallback) {
            const parts = `${text}`.split(",").map(part => Number.parseInt(part.trim(), 10));
            if (parts.length !== 3 || parts.some(part => Number.isNaN(part))) {
                return fallback;
            }
            return parts.map(part => clamp(part, 0, 255) / 255);
        }

        function makeDeepRgb(rgb) {
            return [
                clamp(rgb[0] * 0.27, 0, 1),
                clamp(rgb[1] * 0.58, 0, 1),
                clamp(rgb[2] * 0.86, 0, 1),
            ];
        }

        function rgba(rgb, alpha) {
            const r = Math.round(clamp(rgb[0], 0, 1) * 255);
            const g = Math.round(clamp(rgb[1], 0, 1) * 255);
            const b = Math.round(clamp(rgb[2], 0, 1) * 255);
            return `rgba(${r},${g},${b},${clamp(alpha, 0, 1)})`;
        }

        function rgbCss(rgb) {
            const r = Math.round(clamp(rgb[0], 0, 1) * 255);
            const g = Math.round(clamp(rgb[1], 0, 1) * 255);
            const b = Math.round(clamp(rgb[2], 0, 1) * 255);
            return `rgb(${r},${g},${b})`;
        }

        function colorsNearlyEqual(a, b) {
            return Math.abs(a[0] - b[0]) < 1e-6 &&
                Math.abs(a[1] - b[1]) < 1e-6 &&
                Math.abs(a[2] - b[2]) < 1e-6;
        }

        function rgbToHsl(rgb) {
            const r = clamp(rgb[0], 0, 1);
            const g = clamp(rgb[1], 0, 1);
            const b = clamp(rgb[2], 0, 1);
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const l = (max + min) * 0.5;
            if (max === min) {
                return [0, 0, l];
            }

            const d = max - min;
            const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            let h;
            if (max === r) {
                h = (g - b) / d + (g < b ? 6 : 0);
            } else if (max === g) {
                h = (b - r) / d + 2;
            } else {
                h = (r - g) / d + 4;
            }

            return [h / 6, s, l];
        }

        function hslToRgb(hsl) {
            const h = ((hsl[0] % 1) + 1) % 1;
            const s = clamp(hsl[1], 0, 1);
            const l = clamp(hsl[2], 0, 1);
            if (s <= 1e-6) {
                return [l, l, l];
            }

            const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
            const p = 2 * l - q;
            const hueToRgb = t => {
                let tt = ((t % 1) + 1) % 1;
                if (tt < 1 / 6) return p + (q - p) * 6 * tt;
                if (tt < 1 / 2) return q;
                if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6;
                return p;
            };

            return [hueToRgb(h + 1 / 3), hueToRgb(h), hueToRgb(h - 1 / 3)];
        }

        function mapThemeRgb(rgb, hueShift, satScale, lightnessOffset) {
            const sourceHsl = rgbToHsl(rgb);
            if (sourceHsl[1] <= 0.015) {
                return rgb;
            }

            const lightnessInfluence = clamp(sourceHsl[1] * 1.25, 0, 1);
            return hslToRgb([
                sourceHsl[0] + hueShift,
                sourceHsl[1] * satScale,
                sourceHsl[2] + lightnessOffset * lightnessInfluence,
            ]);
        }

        function evalScalarStops(stops, t, fallback = 1.0) {
            if (!Array.isArray(stops) || stops.length === 0) {
                return fallback;
            }

            if (t <= stops[0].t) {
                return stops[0].v;
            }

            for (let i = 1; i < stops.length; i++) {
                if (t <= stops[i].t) {
                    return evalScalarSegment(stops[i - 1], stops[i], t);
                }
            }

            return stops[stops.length - 1].v;
        }

        function evalScalarSegment(a, b, t) {
            const dt = Math.max(1e-6, b.t - a.t);
            const s = clamp((t - a.t) / dt, 0, 1);
            if (!Number.isFinite(a.outSlope) || !Number.isFinite(b.inSlope)) {
                return lerp(a.v, b.v, s);
            }

            const s2 = s * s;
            const s3 = s2 * s;
            const h00 = 2 * s3 - 3 * s2 + 1;
            const h10 = s3 - 2 * s2 + s;
            const h01 = -2 * s3 + 3 * s2;
            const h11 = s3 - s2;
            return h00 * a.v + h10 * dt * a.outSlope + h01 * b.v + h11 * dt * b.inSlope;
        }

        function evalColorStops(stops, t, fallback) {
            if (!Array.isArray(stops) || stops.length === 0) {
                return fallback;
            }

            if (t <= stops[0].t) {
                return stops[0].c;
            }

            for (let i = 1; i < stops.length; i++) {
                if (t <= stops[i].t) {
                    const a = stops[i - 1];
                    const b = stops[i];
                    const lt = (t - a.t) / Math.max(1e-6, b.t - a.t);
                    return [
                        lerp(a.c[0], b.c[0], lt),
                        lerp(a.c[1], b.c[1], lt),
                        lerp(a.c[2], b.c[2], lt),
                    ];
                }
            }

            return stops[stops.length - 1].c;
        }

        function buildSubsystemMap(globalScale) {
            const raw = {

                    ],

                        { t: 30262 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1.0] },
                        { t: 43369 / 65535, c: [0.3529411852359772, 0.729411780834198, 0.9450981020927429] },
                        { t: 54163 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1.0] },

                    ],
                    alphaStops: [

                    uvStartFrameMode: 3,

                },
                ring4: {

                    rateOverDistance: 5.0,

                    sizeCurve: [

                        { t: 1.0, v: 0.0, inSlope: -2.1621501445770264, outSlope: -2.1621501445770264 },
                    ],
                    colorStops: [
                        { t: 11951 / 65535, c: [1.0, 1.0, 1.0] },
                        { t: 18504 / 65535, c: [0.37264150381088257, 0.7731872797012329, 1.0] },
                        { t: 30262 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1.0] },
                        { t: 43369 / 65535, c: [0.3529411852359772, 0.729411780834198, 0.9450981020927429] },
                        { t: 54163 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1.0] },

                    ],
                    alphaStops: [

                    ],
                    uvEnabled: true,

                    uvStartFrameMode: 3,

                },
                meshTri: {
                    lifetimeSec: 0.6,
                    size: 0.12,
                    localScale: 1.0,
                    startSizeMode: 3,
                    startSizeScalar: 0.11999999731779099,
                    startSizeMinScalar: 0.14000000059604645,
                    startRotationMode: 3,
                    startRotationScalar: 6.283185005187988,
                    startRotationMinScalar: 0.0,
                    clickBurst: 2,
                    rotationEnabled: true,
                    rotationScalar: 11.170106887817383,
                    rotationCurveMin: [
                        { t: 0.14903903007507324, v: 1.0 },
                        { t: 1.0, v: 0.4556182622909546 },
                    ],
                    rotationCurveMax: [
                        { t: 0.1586538404226303, v: 0.7988165616989136 },
                        { t: 1.0, v: -0.0650913417339325 },
                    ],
                    customData0Curve: [
                        { t: 0.0, v: 1.0, inSlope: 0.0, outSlope: 0.0 },
                        { t: 0.20000000298023224, v: 0.0, inSlope: 0.0, outSlope: 2.4249367713928223 },
                        { t: 1.0, v: 1.0, inSlope: 0.27735635638237, outSlope: 0.27735635638237 },
                    ],
                    sizeCurve: [
                        { t: 0.00720977783203125, v: 0.4205089807510376, inSlope: 2.4004733562469482, outSlope: 2.4004733562469482 },
                        { t: 0.21392822265625, v: 0.7159773111343384, inSlope: 0.9115744829177856, outSlope: 0.9115744829177856 },
                        { t: 1.0, v: 1.0, inSlope: 0.0, outSlope: 0.0 },
                    ],
                    colorStops: [
                        { t: 7325 / 65535, c: [1.0, 1.0, 1.0] },
                        { t: 32768 / 65535, c: [0.2971698045730591, 0.6532865166664124, 1.0] },
                        { t: 1.0, c: [0.0, 0.08176128566265106, 0.801886796951294] },
                    ],
                    alphaStops: [
                        { t: 0.0, v: 1.0 },
                        { t: 7132 / 65535, v: 1.0 },
                        { t: 1.0, v: 1.0 },
                    ],
                },
                trail: {
                    lifetimeSec: 0.30000001192092896,
                    widthMultiplier: 0.004999999888241291,
                    minVertexDistance: 0.009999999776482582,
                    numCornerVertices: 4,
                    numCapVertices: 1,
                    killUnderTimeScale: 0.19,
                    hdrColor: [23.968628, 23.968628, 23.968628],
                    gradientMode: 0,
                    colorKeys: [
                        { t: 1349 / 65535, c: [0.0, 0.3905813694000244, 1.0] },
                        { t: 27563 / 65535, c: [0.0, 0.09486991167068481, 0.2823529541492462] },
                        { t: 1.0, c: [0.0, 0.0, 0.0] },
                    ],
                    alphaKeys: [
                        { t: 0.0, v: 1.0 },
                        { t: 1.0, v: 1.0 },
                    ],
                },
            };

            const mapped = {};
            for (const [key, value] of Object.entries(raw)) {
                const size = value.size ?? 0.0;
                const localScale = value.localScale ?? 1.0;
                const lifetimeSec = value.lifetimeSec ?? 0.0001;
                mapped[key] = {
                    ...value,
                    lifetimeSec,
                    size,
                    rateOverDistance: value.rateOverDistance ?? 0.0,
                    clickBurst: value.clickBurst ?? 0,
                    distanceBurst: value.distanceBurst ?? 1,
                    startLifetimeMode: value.startLifetimeMode ?? 0,
                    startLifetimeScalar: value.startLifetimeScalar ?? lifetimeSec,
                    startLifetimeMinScalar: value.startLifetimeMinScalar ?? lifetimeSec,
                    startSpeedMode: value.startSpeedMode ?? 0,
                    startSpeedScalar: value.startSpeedScalar ?? 0.0,
                    startSpeedMinScalar: value.startSpeedMinScalar ?? 0.0,
                    startSizeMode: value.startSizeMode ?? 0,
                    startSizeScalar: value.startSizeScalar ?? size,
                    startSizeMinScalar: value.startSizeMinScalar ?? size,
                    startRotationMode: value.startRotationMode ?? 0,
                    startRotationScalar: value.startRotationScalar ?? 0,
                    startRotationMinScalar: value.startRotationMinScalar ?? 0,
                    uvEnabled: value.uvEnabled ?? false,
                    uvTilesX: value.uvTilesX ?? 1,
                    uvTilesY: value.uvTilesY ?? 1,
                    uvCycles: value.uvCycles ?? 1.0,
                    localScalePx: localScale * UNITY_SIZE_TO_PX * globalScale,
                    sizePx: size * localScale * UNITY_SIZE_TO_PX * globalScale,
                    widthPx: (value.widthMultiplier ?? 0.0) * UNITY_SIZE_TO_PX * TRAIL_BASE_WIDTH_SCALE,
                    minVertexDistancePx: (value.minVertexDistance ?? 0.0) * UNITY_SIZE_TO_PX * globalScale,
                    hdrGain: ((value.hdrColor?.[0] ?? 1) + (value.hdrColor?.[1] ?? 1) + (value.hdrColor?.[2] ?? 1)) / 3,
                };
            }

            return mapped;
        }

        class MouseSpark {
            constructor(opts = {}) {
                this.color = opts.color || DEFAULT_COLOR;
                this.scale = opts.scale || UI_DEFAULT_SCALE;
                this.opacity = opts.opacity || 1.0;
                this.trailSpeed = opts.trailSpeed != null ? opts.trailSpeed : (opts.speed || 1.0);
                this.clickSpeed = opts.clickSpeed != null ? opts.clickSpeed : (opts.speed || 1.0);
                this.trailThickness = opts.trailThickness != null ? opts.trailThickness : 1.0;
                this.glowIntensity = opts.glowIntensity != null ? opts.glowIntensity : 1.0;
                this.trailDelayMs = opts.trailDelayMs != null ? opts.trailDelayMs : 100;
                this.trailFrameIntervalMs = 1000 / 60;
                this.trailRenderAccumulator = 1.0;
                this.lastTrailRenderGateMs = performance.now();

                this.clickEffects = [];
                this.distanceEffects = [];
                this.trail = [];
                this.isDown = false;
                this.lastPos = null;
                this.maxDeltaMs = 100;
                this.lastFrameTime = performance.now();
                this.dpr = 1;
                this.cssWidth = 1;
                this.cssHeight = 1;
                this.previousDirtyRects = [];
                this.forceFullRedraw = true;

                this.trailEmitX = Number.NaN;
                this.trailEmitY = Number.NaN;
                this.trailEmitTimeMs = Number.NaN;
                this.trailLastPos = null;
                this.trailSmoothX = Number.NaN;
                this.trailSmoothY = Number.NaN;
                this.trailLastSmoothTime = Number.NaN;
                this.trailAlphaBuffer = new Float32Array(TRAIL_MAX_POINTS);
                this.trailHeadProgressBuffer = new Float32Array(TRAIL_MAX_POINTS);
                this.trailRibbonSamples = new Float32Array((TRAIL_RIBBON_MAX_SEGMENTS + 1) * 5);
                this.previousTrailGlowRect = null;
                this.activeTrailGlowRect = null;
                this.distanceAccumulator = 0;
                this.subsystemGlobalScale = Number.NaN;

                this.rebuildConfig();
                this.initCanvas();
                this.bindEvents();
            }

            rebuildConfig() {
                const base = parseRgb(this.color, DEFAULT_COLOR_RGB);
                const defaultHsl = rgbToHsl(DEFAULT_COLOR_RGB);
                const themeHsl = rgbToHsl(base);
                const globalScale = clamp(this.scale / UI_DEFAULT_SCALE, 0.5, 3.0);
                const rawGlowIntensity = Number(this.glowIntensity);
                const glowIntensity = clamp(Number.isFinite(rawGlowIntensity) ? rawGlowIntensity : 1.0, 0, 3);
                const glowOverdrive = Math.max(0, glowIntensity - 1.0);
                const colorMapActive = !colorsNearlyEqual(base, DEFAULT_COLOR_RGB);
                const themeHueShift = themeHsl[0] - defaultHsl[0];
                const themeSatScale = defaultHsl[1] > 1e-6 ? themeHsl[1] / defaultHsl[1] : 1.0;
                const themeLightnessOffset = themeHsl[2] - defaultHsl[2];
                this.cfg = {
                    globalScale,
                    colorBase: base,
                    colorDeep: colorMapActive ? mapThemeRgb(makeDeepRgb(DEFAULT_COLOR_RGB), themeHueShift, themeSatScale, themeLightnessOffset) : makeDeepRgb(base),
                    colorWhite: [1, 1, 1],
                    trailThickness: clamp(this.trailThickness, 0.5, 3.0),
                    glowIntensity,
                    glowGain: glowIntensity <= 1.0
                        ? 1.55 * glowIntensity
                        : 1.55 + 0.65 * glowOverdrive,
                    glowSpreadScale: glowIntensity > 0
                        ? 0.68 + 0.42 * Math.sqrt(Math.min(glowIntensity, 1.0)) + 0.06 * glowOverdrive
                        : 0,
                    glowOverdrive,
                    colorMapActive,
                    themeHueShift,
                    themeSatScale,
                    themeLightnessOffset,
                    distanceEmitStepPx: 100,
                };
                if (this.subsystemGlobalScale !== globalScale) {
                    this.subsystems = buildSubsystemMap(globalScale);
                    this.subsystemGlobalScale = globalScale;
                }
                if (glowIntensity <= 0) {
                    this._releaseTrailGlowBuffers();
                }
            }

            themeRgb(rgb) {
                if (!this.cfg.colorMapActive) {
                    return rgb;
                }

                return mapThemeRgb(rgb, this.cfg.themeHueShift, this.cfg.themeSatScale, this.cfg.themeLightnessOffset);
            }

            bindEvents() {
                window.addEventListener("mousedown", e => {
                    this.pointerDown(e.clientX, e.clientY);
                });

                window.addEventListener("mousemove", e => {
                    this.pointerMove(e.clientX, e.clientY);
                });

                window.addEventListener("mouseup", () => {
                    this.pointerUp();
                });
            }

            pointerDown(x, y) {
                if (this.clickEffects.length === 0 && this.distanceEffects.length === 0 && this.trail.length === 0) {
                    this.lastFrameTime = performance.now();
                }

                this.isDown = true;
                this.lastPos = { x, y };
                this.distanceAccumulator = 0;
                this.trailEmitX = x;
                this.trailEmitY = y;
                this.resetTrailSmoothing(this.lastPos);
                this.beginTrailStroke(x, y);
                this.createEffects(x, y);
            }

            beginTrailStrokeOnly(x, y, pointerDown) {
                if (this.clickEffects.length === 0 && this.distanceEffects.length === 0 && this.trail.length === 0) {
                    this.lastFrameTime = performance.now();
                }

                this.isDown = Boolean(pointerDown);
                this.lastPos = { x, y };
                this.distanceAccumulator = 0;
                this.trailEmitX = x;
                this.trailEmitY = y;
                this.resetTrailSmoothing(this.lastPos);
                this.beginTrailStroke(x, y);
            }

            pointerMove(x, y) {
                if (!this.isDown && !window.effectiveAlwaysTrail) return;

                const point = { x, y };
                const previous = this.lastPos;
                if (!previous) {
                    this.lastPos = point;
                    const trailPoint = this.resetTrailSmoothing(point);
                    if (window.effectiveAlwaysTrail) {
                        this.beginTrailStroke(trailPoint.x, trailPoint.y);
                    }
                    return;
                }

                const distance = Math.hypot(x - previous.x, y - previous.y);
                if (distance > 0) {
                    const previousTrail = this.trailLastPos ?? this.resetTrailSmoothing(previous);
                    const trailPoint = this.smoothTrailPoint(point);
                    const trailDistance = Math.hypot(trailPoint.x - previousTrail.x, trailPoint.y - previousTrail.y);
                    if (trailDistance > 0.01) {
                        this.handleTrailMove(trailPoint);
                    }
                    this.trailLastPos = trailPoint;
                    if (this.isDown) {
                        this.handleDistanceEmitter(point, distance);
                    }
                }

                this.lastPos = point;
            }

            pointerUp() {
                this.isDown = false;
                this.trailEmitX = Number.NaN;
                this.trailEmitY = Number.NaN;
                this.trailEmitTimeMs = Number.NaN;
                if (!window.effectiveAlwaysTrail) {
                    this.trailLastPos = null;
                    this.trailSmoothX = Number.NaN;
                    this.trailSmoothY = Number.NaN;
                    this.trailLastSmoothTime = Number.NaN;
                }
                this.distanceAccumulator = 0;
            }

            initCanvas() {
                this.mainCanvas = document.getElementById("sparkCanvas");
                this.mainCtx = this.mainCanvas.getContext("2d");
                this.bufferCtx = this.mainCtx;
                this.trailGlowCanvas = null;
                this.trailGlowCtx = null;
                this.trailHeadGlowCanvas = null;
                this.trailHeadGlowCtx = null;
                this.trailBloomCanvas = null;
                this.trailBloomCtx = null;
                this.resize();
                window.addEventListener("resize", () => this.resize());
            }

            clearEffects() {
                this.clickEffects = [];
                this.distanceEffects = [];
                this.trail = [];
                this.isDown = false;
                this.lastPos = null;
                this.trailEmitX = Number.NaN;
                this.trailEmitY = Number.NaN;
                this.trailEmitTimeMs = Number.NaN;
                this.trailLastPos = null;
                this.trailSmoothX = Number.NaN;
                this.trailSmoothY = Number.NaN;
                this.trailLastSmoothTime = Number.NaN;
                this.trailRenderAccumulator = 1.0;
                this.lastTrailRenderGateMs = performance.now();
                this.previousDirtyRects = [];
                this.forceFullRedraw = true;
                this.lastFrameTime = performance.now();
                this.mainCtx?.clearRect(0, 0, this.cssWidth, this.cssHeight);
                this._clearTrailGlowBuffers();
                this.previousTrailGlowRect = null;
                this.activeTrailGlowRect = null;
            }

            alpha(value) {
                return clamp(value * this.opacity, 0, 1);
            }

            glowSpreadPx(basePx) {
                return basePx * this.cfg.globalScale * this.cfg.glowSpreadScale;
            }

            clickGlowBlurPx(basePx) {
                return Math.min(this.glowSpreadPx(basePx) * this.dpr, MAX_CLICK_SHADOW_BLUR_PX);
            }

            trailGlowSpreadPx(basePx) {
                return basePx * this.cfg.glowSpreadScale;
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                const cssWidth = Math.max(1, window.innerWidth);
                const cssHeight = Math.max(1, window.innerHeight);
                const w = Math.max(1, Math.floor(cssWidth * dpr));
                const h = Math.max(1, Math.floor(cssHeight * dpr));

                this.dpr = dpr;
                this.cssWidth = cssWidth;
                this.cssHeight = cssHeight;
                this.mainCanvas.width = w;
                this.mainCanvas.height = h;
                this.previousDirtyRects = [];
                this.previousTrailGlowRect = null;
                this.activeTrailGlowRect = null;
                this.forceFullRedraw = true;
                this.mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                if (this.trailGlowCanvas && this.cfg.glowGain > 0) {
                    this._resizeTrailGlowBuffers();
                } else if (this.cfg.glowGain <= 0) {
                    this._releaseTrailGlowBuffers();
                }
            }

            resetTrailSmoothing(point) {
                this.trailSmoothX = point.x;
                this.trailSmoothY = point.y;
                this.trailLastSmoothTime = performance.now();
                this.trailLastPos = { x: point.x, y: point.y };
                return this.trailLastPos;
            }

            smoothTrailPoint(point) {
                if (!Number.isFinite(this.trailSmoothX) || !Number.isFinite(this.trailSmoothY)) {
                    return this.resetTrailSmoothing(point);
                }

                const dx = point.x - this.trailSmoothX;
                const dy = point.y - this.trailSmoothY;
                const d = Math.hypot(dx, dy);
                const now = performance.now();
                const elapsedMs = Number.isFinite(this.trailLastSmoothTime)
                    ? Math.max(0, now - this.trailLastSmoothTime)
                    : 1000 / 40;
                this.trailLastSmoothTime = now;
                if (d < 0.25) {
                    return { x: this.trailSmoothX, y: this.trailSmoothY };
                }

                const baseAlpha = clamp(d / (d + TRAIL_SMOOTHING_RADIUS_PX), 0.18, 0.72);
                const timeScale = clamp(elapsedMs / (1000 / 40), 0.1, 4.0);
                const alpha = 1 - Math.pow(1 - baseAlpha, timeScale);
                this.trailSmoothX += dx * alpha;
                this.trailSmoothY += dy * alpha;
                return { x: this.trailSmoothX, y: this.trailSmoothY };
            }

            sampleMinMaxConstant(mode, scalar, minScalar) {
                if (mode === 3) {
                    const lo = Math.min(minScalar, scalar);
                    const hi = Math.max(minScalar, scalar);
                    return randomRange(lo, hi);
                }
                return scalar;
            }

            sampleStartLifetimeSec(params) {
                return Math.max(0.0001, this.sampleMinMaxConstant(
                    params.startLifetimeMode,
                    params.startLifetimeScalar,
                    params.startLifetimeMinScalar
                ));
            }

            sampleStartSizeMul(params) {
                return this.sampleMinMaxConstant(
                    params.startSizeMode,
                    params.startSizeScalar,
                    params.startSizeMinScalar
                ) / Math.max(1e-6, params.size);
            }

            sampleStartRotation(params) {
                return this.sampleMinMaxConstant(
                    params.startRotationMode,
                    params.startRotationScalar,
                    params.startRotationMinScalar
                );
            }

            sampleUvStartFrameNorm(params) {
                return clamp(this.sampleMinMaxConstant(
                    params.uvStartFrameMode,
                    params.uvStartFrameScalar,
                    params.uvStartFrameMinScalar
                ), 0, 1);
            }

            sampleUvFrameOverTimeNorm(params) {
                return Math.max(0, this.sampleMinMaxConstant(
                    params.uvFrameOverTimeMode,
                    params.uvFrameOverTimeScalar,
                    params.uvFrameOverTimeMinScalar
                ));
            }

            emitRing() {
                const params = this.subsystems.ring;
                return {
                    params,
                    lifetimeSec: params.lifetimeSec,
                    lifetimeMs: Math.max(16, Math.round(params.lifetimeSec * 1000)),
                    startRotationRad: this.sampleStartRotation(params),
                };
            }

            emitTriangleParticles(params, countOverride = null) {
                const count = Math.max(0, Math.round(countOverride ?? params.clickBurst));
                const particles = [];

                for (let i = 0; i < count; i++) {
                    const itemLifetimeSec = this.sampleStartLifetimeSec(params);
                    particles.push({
                        angle: Math.random() * Math.PI * 2,
                        orientBase: Math.random() < 0.5 ? 0 : Math.PI,
                        spin: 0,
                        lifetimeSec: itemLifetimeSec,
                        lifetimeMs: Math.max(16, Math.round(itemLifetimeSec * 1000)),
                        speedPxPerSec: this.sampleMinMaxConstant(
                            params.startSpeedMode,
                            params.startSpeedScalar,
                            params.startSpeedMinScalar
                        ),
                        sizeMul: this.sampleStartSizeMul(params),
                        uvStartFrameNorm: this.sampleUvStartFrameNorm(params),
                        uvFrameOverTimeNorm: this.sampleUvFrameOverTimeNorm(params),
                    });
                }

                const fallbackMs = Math.max(16, Math.round(params.lifetimeSec * 1000));
                const lifetimeMs = particles.reduce((maxMs, item) => Math.max(maxMs, item.lifetimeMs), fallbackMs);
                return { params, lifetimeMs, lifetimeSec: lifetimeMs / 1000, particles };
            }

            emitMeshTri() {
                const params = this.subsystems.meshTri;
                const rings = [];
                for (let i = 0; i < Math.max(0, Math.round(params.clickBurst)); i++) {
                    rings.push({
                        angle: this.sampleStartRotation(params),
                        rotMix: Math.random(),
                        radiusMul: this.sampleStartSizeMul(params),
                        widthMul: 1.0,
                        phase: 0.0,
                    });
                }

                return {
                    params,
                    lifetimeMs: Math.max(16, Math.round(params.lifetimeSec * 1000)),
                    lifetimeSec: params.lifetimeSec,
                    rings,
                };
            }

            createEffects(x, y) {
                const parts = {
                    ring: this.emitRing(),
                    ring3: this.emitTriangleParticles(this.subsystems.ring3),
                    meshTri: this.emitMeshTri(),
                };
                const durationMs = Math.max(
                    parts.ring.lifetimeMs,
                    parts.ring3.lifetimeMs,
                    parts.meshTri.lifetimeMs
                );
                this.clickEffects.push({ x, y, tMs: 0, durationMs, parts });
                if (this.clickEffects.length > MAX_CLICK_EFFECTS) {
                    this.clickEffects.splice(0, this.clickEffects.length - MAX_CLICK_EFFECTS);
                }
            }

            beginTrailStroke(x, y) {
                if (!this.subsystems.trail) return;

                const now = performance.now();
                this.appendTrailPoint(x, y, now, true);
                this.trailEmitX = x;
                this.trailEmitY = y;
                this.trailEmitTimeMs = now;
                this.trimTrailPoints();
            }

            appendTrailPoint(x, y, tMs, penUp = false) {
                const last = this.trail[this.trail.length - 1];
                if (last && last.penUp === penUp && Math.hypot(last.x - x, last.y - y) < 0.35) {
                    last.x = x;
                    last.y = y;
                    last.tMs = tMs;
                    return;
                }
                this.trail.push({ x, y, tMs, penUp });
            }

            trimTrailPoints(nowMs = performance.now()) {
                this.pruneTrail(nowMs);
                if (this.trail.length <= TRAIL_MAX_POINTS) return;

                const source = this.trail;
                const mandatory = new Uint8Array(source.length);
                let mandatoryCount = 0;
                for (let i = 0; i < source.length; i++) {
                    if (i === source.length - 1 || source[i].penUp || (i + 1 < source.length && source[i + 1].penUp)) {
                        mandatory[i] = 1;
                        mandatoryCount++;
                    }
                }

                const target = Math.max(mandatoryCount, TRAIL_COMPACT_TARGET);
                const candidates = [];
                for (let i = 0; i < source.length; i++) {
                    if (!mandatory[i]) candidates.push(i);
                }

                const slots = Math.max(0, target - mandatoryCount);
                const selected = new Uint8Array(source.length);
                for (let i = 0; i < source.length; i++) {
                    if (mandatory[i]) selected[i] = 1;
                }
                for (let i = 0; i < slots && i < candidates.length; i++) {
                    const candidateIndex = Math.floor(((i + 0.5) * candidates.length) / slots);
                    selected[candidates[Math.min(candidateIndex, candidates.length - 1)]] = 1;
                }

                const compacted = [];
                for (let i = 0; i < source.length; i++) {
                    if (selected[i]) compacted.push(source[i]);
                }
                this.trail = compacted;
            }

            handleTrailMove(current) {
                const trail = this.subsystems.trail;
                if (!trail) return;

                const now = performance.now();
                const minStep = Math.max(1e-3, trail.minVertexDistancePx);
                if (!Number.isFinite(this.trailEmitX) || !Number.isFinite(this.trailEmitY)) {
                    this.trailEmitX = current.x;
                    this.trailEmitY = current.y;
                    this.trailEmitTimeMs = now;
                    return;
                }

                const startX = this.trailEmitX;
                const startY = this.trailEmitY;
                const distance = Math.hypot(current.x - startX, current.y - startY);
                if (distance < minStep) {
                    return;
                }

                let startTimeMs = Number.isFinite(this.trailEmitTimeMs) ? this.trailEmitTimeMs : now;
                const segmentCount = Math.min(
                    MAX_TRAIL_SEGMENTS_PER_MOVE,
                    Math.max(1, Math.ceil(distance / Math.max(minStep, TRAIL_TARGET_SEGMENT_PX)))
                );
                if (this.trail.length === 0) {
                    startTimeMs = now;
                    this.appendTrailPoint(startX, startY, startTimeMs, true);
                }
                for (let i = 1; i <= segmentCount; i++) {
                    const ratio = i / segmentCount;
                    this.appendTrailPoint(
                        lerp(startX, current.x, ratio),
                        lerp(startY, current.y, ratio),
                        lerp(startTimeMs, now, ratio)
                    );
                }

                this.trailEmitX = current.x;
                this.trailEmitY = current.y;
                this.trailEmitTimeMs = now;
                this.trimTrailPoints();
            }

            handleDistanceEmitter(current, distance) {
                const ring4 = this.subsystems.ring4;
                if (!ring4 || ring4.rateOverDistance <= 0) return;

                const stepPx = clamp(this.cfg.distanceEmitStepPx * (UNITY_RATE_DISTANCE_BASE / ring4.rateOverDistance), 2, 240);
                this.distanceAccumulator += distance;
                let emitEvents = 0;
                while (this.distanceAccumulator >= stepPx && emitEvents < MAX_DISTANCE_EMIT_EVENTS_PER_MOVE) {
                    this.distanceAccumulator -= stepPx;
                    emitEvents++;
                }
                if (emitEvents >= MAX_DISTANCE_EMIT_EVENTS_PER_MOVE && this.distanceAccumulator >= stepPx) {
                    this.distanceAccumulator = 0;
                }

                if (emitEvents > 0) {
                    const burstCount = Math.max(1, Math.round((ring4.distanceBurst ?? 1) * emitEvents));
                    const part = this.emitTriangleParticles(ring4, burstCount);
                    this.distanceEffects.push({
                        x: current.x,
                        y: current.y,
                        tMs: 0,
                        durationMs: part.lifetimeMs,
                        part,
                    });
                    if (this.distanceEffects.length > MAX_DISTANCE_EFFECTS) {
                        this.distanceEffects.splice(0, this.distanceEffects.length - MAX_DISTANCE_EFFECTS);
                    }
                }
            }

            subProgress(sub, tMs) {
                return clamp(tMs / (sub.lifetimeMs ?? sub.params.lifetimeMs), 0, 1);
            }

            subSizeCurve(sub, p) {
                return evalScalarStops(sub.params.sizeCurve, p, 1.0);
            }

            subColor(sub, p, fallbackRgb, fallbackAlpha = 1.0) {
                const hasStops = Array.isArray(sub.params.colorStops) && sub.params.colorStops.length > 0;
                const rgb = hasStops ? evalColorStops(sub.params.colorStops, p, fallbackRgb) : fallbackRgb;
                const alpha = evalScalarStops(sub.params.alphaStops, p, fallbackAlpha);
                const mapped = hasStops ? this.themeRgb(rgb) : rgb;
                return [mapped[0], mapped[1], mapped[2], alpha];
            }

            uvFrameFactor(sub, p, item) {
                if (!sub.params.uvEnabled || sub.params.uvTilesX <= 1) {
                    return 1.0;
                }

                const tilesX = Math.max(1, Math.round(sub.params.uvTilesX ?? 1));
                const tilesY = Math.max(1, Math.round(sub.params.uvTilesY ?? 1));
                const totalFrames = tilesX * tilesY;
                const cycles = Math.max(0.001, sub.params.uvCycles ?? 1.0);
                const frameNorm = item.uvStartFrameNorm + item.uvFrameOverTimeNorm * p * cycles;
                const wrapped = ((frameNorm % 1) + 1) % 1;
                const framePos = wrapped * totalFrames;
                const frame0 = Math.floor(framePos) % totalFrames;
                const frame1 = (frame0 + 1) % totalFrames;
                const blend = framePos - Math.floor(framePos);
                if (totalFrames !== 2) return 1.0;
                return lerp(frame0 % 2 === 0 ? 0.78 : 1.0, frame1 % 2 === 0 ? 0.78 : 1.0, blend);
            }

            drawClickEffect(effect, glowEnabled) {
                this.renderRing(effect, glowEnabled);
                this.renderTriangleLayer(effect.x, effect.y, effect.parts.ring3, effect.tMs, glowEnabled);
                this.renderMeshTri(effect, glowEnabled);
            }

            renderRing(effect, glowEnabled) {
                const ctx = this.bufferCtx;
                const sub = effect.parts.ring;
                const p = this.subProgress(sub, effect.tMs);
                if (p >= 1) return;
                const colorSettleP = 7903 / 65535;
                if (p < colorSettleP) return;

                const curve = this.subSizeCurve(sub, p);
                const col = this.subColor(sub, p, this.cfg.colorBase, 1.0);
                const radius = sub.params.sizePx * Math.max(0, curve);
                const entryFade = clamp((p - colorSettleP) / 0.04, 0, 1);

                ctx.save();
                ctx.translate(effect.x, effect.y);
                ctx.rotate(sub.startRotationRad ?? 0);
                ctx.scale(1.0, 0.94);
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                if (glowEnabled && this.cfg.glowGain > 0) {
                    ctx.shadowBlur = this.clickGlowBlurPx(10);
                    ctx.shadowColor = rgba(
                        [col[0], col[1], col[2]],
                        clamp(0.62 * this.cfg.glowGain, 0, 0.95)
                    );
                }
                ctx.fillStyle = rgba([col[0], col[1], col[2]], this.alpha(0.58 * col[3] * entryFade));
                ctx.fill();
                if (glowEnabled && this.cfg.glowOverdrive > 0) {
                    ctx.shadowBlur = this.clickGlowBlurPx(6);
                    ctx.shadowColor = rgba([col[0], col[1], col[2]], 0.65);
                    ctx.globalAlpha = clamp(0.18 * this.cfg.glowOverdrive, 0, 0.36);
                    ctx.fill();
                }
                ctx.restore();
            }

            renderTriangleLayer(cx, cy, sub, tMs, glowEnabled = false) {
                if (!sub.particles || sub.particles.length === 0) return;

                for (const item of sub.particles) {
                    const p = clamp(tMs / (item.lifetimeMs ?? sub.lifetimeMs), 0, 1);
                    if (p >= 1) continue;

                    const lifeSec = item.lifetimeSec ?? sub.lifetimeSec;
                    const curve = this.subSizeCurve(sub, p);
                    const col = this.subColor(sub, p, this.cfg.colorBase, 1.0);
                    const dist = item.speedPxPerSec * lifeSec * p;
                    const radius = sub.params.localScalePx * (sub.params.shapeScale + dist);
                    const x = cx + Math.cos(item.angle) * radius;
                    const y = cy + Math.sin(item.angle) * radius;
                    const alpha = clamp(col[3] * this.uvFrameFactor(sub, p, item), 0, 1);
                    const size = sub.params.sizePx * item.sizeMul * Math.max(0, curve);
                    this.drawTriangle(x, y, size, item.orientBase ?? 0, [col[0], col[1], col[2]], this.cfg.colorWhite, alpha, glowEnabled);
                }
            }

            drawTriangle(x, y, size, orient, baseCol, highlightCol, alpha, glowEnabled = false) {
                const ctx = this.bufferCtx;
                const side = size * 1.35;
                const h = side * 0.8660254;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(orient);

                ctx.beginPath();
                ctx.moveTo(0, -2 * h / 3);
                ctx.lineTo(-side / 2, h / 3);
                ctx.lineTo(side / 2, h / 3);
                ctx.closePath();
                if (glowEnabled && this.cfg.glowGain > 0 && alpha > 0.08 && size > 0.6) {
                    ctx.shadowBlur = this.clickGlowBlurPx(2.2);
                    ctx.shadowColor = rgba(baseCol, clamp(0.36 * this.cfg.glowGain, 0, 0.82));
                }
                ctx.fillStyle = rgba(baseCol, this.alpha(alpha));
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = "rgba(0,0,0,0)";
                if (glowEnabled && this.cfg.glowOverdrive > 0) {
                    ctx.globalAlpha = clamp(0.14 * this.cfg.glowOverdrive, 0, 0.28);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                ctx.beginPath();
                ctx.moveTo(0, -2 * h / 3);
                ctx.lineTo(-side * 0.25, -h * 0.02);
                ctx.lineTo(side * 0.25, -h * 0.02);
                ctx.closePath();
                ctx.fillStyle = rgba(highlightCol, this.alpha(alpha * 0.25));
                ctx.fill();

                ctx.restore();
            }

            meshTriAngularVelocity(sub, p, blend, scalar) {
                const minV = evalScalarStops(sub.params.rotationCurveMin, p, 0);
                const maxV = evalScalarStops(sub.params.rotationCurveMax, p, 0);
                return lerp(minV, maxV, blend) * scalar;
            }

            meshTriRotation(sub, p, mix) {
                if (!sub.params.rotationEnabled || p <= 0) return 0;
                const lifeSec = sub.lifetimeSec ?? sub.params.lifetimeSec ?? 0;
                if (lifeSec <= 0) return 0;

                const blend = clamp(mix, 0, 1);
                const scalar = sub.params.rotationScalar ?? 0;
                const steps = 8;
                let integral = 0;
                let prev = this.meshTriAngularVelocity(sub, 0, blend, scalar);
                for (let i = 1; i <= steps; i++) {
                    const u = (p * i) / steps;
                    const curr = this.meshTriAngularVelocity(sub, u, blend, scalar);
                    integral += (prev + curr) * 0.5 * (p / steps);
                    prev = curr;
                }
                return -integral * lifeSec;
            }

            meshTriCustom0(sub, p) {
                return evalScalarStops(sub.params.customData0Curve, p, 1.0);
            }

            renderMeshTri(effect, glowEnabled) {
                const ctx = this.bufferCtx;
                const sub = effect.parts.meshTri;
                const p = this.subProgress(sub, effect.tMs);
                if (p >= 1) return;

                ctx.save();
                for (const item of sub.rings) {
                    const localP = clamp(p + item.phase * 0.08, 0, 1);
                    const curve = this.subSizeCurve(sub, localP);
                    const col = this.subColor(sub, localP, this.cfg.colorBase, 1.0);
                    const baseRadius = sub.params.sizePx * item.radiusMul * Math.max(0, curve);
                    const innerR = baseRadius;
                    const outerR = baseRadius * 1.0636685;
                    const width = Math.max(0.9, (outerR - innerR) * item.widthMul);
                    const custom0 = this.meshTriCustom0(sub, localP);
                    const dynamicLen = lerp(0, Math.PI * 2, clamp(1 - custom0, 0, 1));
                    if (dynamicLen <= 0.04) continue;

                    const center = item.angle + this.meshTriRotation(sub, localP, item.rotMix);
                    const start = center;
                    const end = center + dynamicLen;
                    const endFade = localP < 0.84 ? 1.0 : clamp((1 - localP) / 0.16, 0, 1);
                    const brightness = clamp((0.34 + (1 - custom0) * 0.96) * endFade, 0, 1.4);
                    const mid = [
                        lerp(col[0], this.cfg.colorWhite[0], 0.32),
                        lerp(col[1], this.cfg.colorWhite[1], 0.32),
                        lerp(col[2], this.cfg.colorWhite[2], 0.32),
                    ];

                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, outerR, start, end, false);
                    ctx.arc(effect.x, effect.y, innerR, end, start, true);
                    ctx.closePath();

                    const grad = ctx.createRadialGradient(effect.x, effect.y, innerR, effect.x, effect.y, outerR);
                    grad.addColorStop(0.00, rgba(this.cfg.colorDeep, this.alpha(0.14 * col[3] * brightness)));
                    grad.addColorStop(0.45, rgba(mid, this.alpha(0.78 * col[3] * brightness)));
                    grad.addColorStop(0.55, rgba(this.cfg.colorWhite, this.alpha(0.95 * col[3] * brightness)));
                    grad.addColorStop(1.00, rgba(this.cfg.colorDeep, this.alpha(0.14 * col[3] * brightness)));
                    ctx.fillStyle = grad;
                    if (glowEnabled && this.cfg.glowGain > 0) {
                        ctx.shadowBlur = this.clickGlowBlurPx(10);
                        ctx.shadowColor = rgba(this.cfg.colorBase, clamp(0.52 * this.cfg.glowGain, 0, 0.94));
                    }
                    ctx.fill();
                    if (glowEnabled && this.cfg.glowOverdrive > 0) {
                        ctx.shadowBlur = this.clickGlowBlurPx(6);
                        ctx.shadowColor = rgba(this.cfg.colorBase, 0.55);
                        ctx.globalAlpha = clamp(0.14 * this.cfg.glowOverdrive, 0, 0.28);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }

                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, (innerR + outerR) * 0.5, start, end);
                    const coreWidth = Math.max(0.7, width * 0.20);
                    if (glowEnabled && this.cfg.glowGain > 0) {
                        ctx.shadowBlur = this.clickGlowBlurPx(6);
                        ctx.shadowColor = rgba(mid, clamp(0.64 * this.cfg.glowGain, 0, 0.98));
                    }
                    ctx.lineWidth = coreWidth;
                    ctx.strokeStyle = rgba(this.cfg.colorWhite, this.alpha(0.60 * col[3] * brightness));
                    ctx.stroke();
                    if (glowEnabled && this.cfg.glowOverdrive > 0) {
                        ctx.shadowBlur = this.clickGlowBlurPx(3.5);
                        ctx.shadowColor = rgba(mid, 0.72);
                        ctx.globalAlpha = clamp(0.16 * this.cfg.glowOverdrive, 0, 0.32);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = "rgba(0,0,0,0)";
                }
                ctx.restore();
            }

            trailPointAgeMs(point, nowMs) {
                return Math.max(0, nowMs - point.tMs - this.trailDelayMs) * this.trailSpeed;
            }

            pruneTrail(nowMs) {
                const trail = this.subsystems.trail;
                const lifeMs = Math.max(1, Math.round((trail?.lifetimeSec ?? 0.3) * 1000));
                let firstAlive = 0;
                while (firstAlive < this.trail.length && this.trailPointAgeMs(this.trail[firstAlive], nowMs) > lifeMs) {
                    firstAlive++;
                }
                if (firstAlive > 0) {
                    this.trail.splice(0, firstAlive);
                }
            }

            evalTrailGradientColor(trail, tNorm) {
                const t = clamp(tNorm, 0, 1);
                const keys = trail.colorKeys ?? [];
                if (keys.length === 0) return [0, 0, 0];
                if ((trail.gradientMode ?? 0) === 1) {
                    let out = keys[0].c ?? [0, 0, 0];
                    for (let i = 1; i < keys.length; i++) {
                        if (keys[i].t > t) break;
                        out = keys[i].c ?? out;
                    }
                    return this.themeRgb(out);
                }
                return this.themeRgb(evalColorStops(keys, t, keys[0].c ?? [0, 0, 0]));
            }

            evalTrailGradientAlpha(trail, tNorm) {
                const t = clamp(tNorm, 0, 1);
                const keys = trail.alphaKeys ?? [];
                if (keys.length === 0) return 1.0;
                return evalScalarStops(keys, t, Number.isFinite(keys[0].v) ? keys[0].v : 1.0);
            }

            sampleTrailTextureMask(tNorm) {
                const index = clamp(tNorm, 0, 1) * TRAIL_MASK_LUT_SIZE;
                const i0 = Math.floor(index);
                const i1 = Math.min(TRAIL_MASK_LUT_SIZE, i0 + 1);
                return lerp(TRAIL_MASK_LUT[i0], TRAIL_MASK_LUT[i1], index - i0);
            }

            shouldSkipTrailOnlyFrame(now) {
                if (this.clickEffects.length > 0 || this.distanceEffects.length > 0 || this.trail.length === 0) {
                    this.trailRenderAccumulator = 1.0;
                    this.lastTrailRenderGateMs = now;
                    return false;
                }

                const elapsed = Math.max(0, now - this.lastTrailRenderGateMs);
                this.lastTrailRenderGateMs = now;
                this.trailRenderAccumulator = Math.min(2.0, this.trailRenderAccumulator + elapsed / this.trailFrameIntervalMs);
                if (this.trailRenderAccumulator < 1.0) {
                    return true;
                }

                this.trailRenderAccumulator -= 1.0;
                return false;
            }

            _buildTrailRibbonSamples(x0, y0, controlX, controlY, x1, y1, curved, progress0, progress1) {
                const directLength = Math.hypot(x1 - x0, y1 - y0);
                const estimatedLength = curved
                    ? Math.hypot(controlX - x0, controlY - y0) + Math.hypot(x1 - controlX, y1 - controlY)
                    : directLength;
                const segmentCount = curved
                    ? clamp(Math.ceil(estimatedLength / TRAIL_RIBBON_SEGMENT_PX), 2, TRAIL_RIBBON_MAX_SEGMENTS)
                    : 1;
                const samples = this.trailRibbonSamples;
                let fallbackDx = x1 - x0;
                let fallbackDy = y1 - y0;
                if (Math.hypot(fallbackDx, fallbackDy) < 1e-4) {
                    fallbackDx = 1;
                    fallbackDy = 0;
                }

                for (let i = 0; i <= segmentCount; i++) {
                    const t = i / segmentCount;
                    let x;
                    let y;
                    let tangentX;
                    let tangentY;
                    if (curved) {
                        const invT = 1 - t;
                        x = invT * invT * x0 + 2 * invT * t * controlX + t * t * x1;
                        y = invT * invT * y0 + 2 * invT * t * controlY + t * t * y1;
                        tangentX = 2 * invT * (controlX - x0) + 2 * t * (x1 - controlX);
                        tangentY = 2 * invT * (controlY - y0) + 2 * t * (y1 - controlY);
                    } else {
                        x = lerp(x0, x1, t);
                        y = lerp(y0, y1, t);
                        tangentX = fallbackDx;
                        tangentY = fallbackDy;
                    }

                    let tangentLength = Math.hypot(tangentX, tangentY);
                    if (tangentLength < 1e-4) {
                        tangentX = fallbackDx;
                        tangentY = fallbackDy;
                        tangentLength = Math.hypot(tangentX, tangentY);
                    } else {
                        fallbackDx = tangentX;
                        fallbackDy = tangentY;
                    }

                    const offset = i * 5;
                    samples[offset] = x;
                    samples[offset + 1] = y;
                    samples[offset + 2] = -tangentY / tangentLength;
                    samples[offset + 3] = tangentX / tangentLength;
                    samples[offset + 4] = lerp(progress0, progress1, t);
                }
                return segmentCount + 1;
            }

            _trailRibbonWidth(baseWidth, progress, layer) {
                const p = clamp(progress, 0, 1);
                const coreWidth = baseWidth * lerp(TRAIL_TAIL_WIDTH_RATIO, 1, p);
                if (layer === 0) return coreWidth;
                if (layer === 1) return Math.max(coreWidth * 1.15, 2.0);

                const rampT = clamp((p - 0.18) / 0.70, 0, 1);
                const rangeRamp = rampT * rampT * (3 - 2 * rampT);
                const fadeT = clamp((p - 0.90) / 0.10, 0, 1);
                const endpointFade = 1 - fadeT * fadeT * (3 - 2 * fadeT);
                return Math.max(coreWidth * 1.15, 2.0) * (0.45 + 0.75 * rangeRamp) * endpointFade;
            }

            _fillTrailRibbon(ctx, sampleCount, baseWidth, layer, alpha) {
                if (!ctx || alpha <= 0.005 || sampleCount < 2) return;

                const samples = this.trailRibbonSamples;
                ctx.beginPath();
                for (let i = 0; i < sampleCount; i++) {
                    const offset = i * 5;
                    const halfWidth = this._trailRibbonWidth(baseWidth, samples[offset + 4], layer) * 0.5;
                    const x = samples[offset] + samples[offset + 2] * halfWidth;
                    const y = samples[offset + 1] + samples[offset + 3] * halfWidth;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                for (let i = sampleCount - 1; i >= 0; i--) {
                    const offset = i * 5;
                    const halfWidth = this._trailRibbonWidth(baseWidth, samples[offset + 4], layer) * 0.5;
                    ctx.lineTo(
                        samples[offset] - samples[offset + 2] * halfWidth,
                        samples[offset + 1] - samples[offset + 3] * halfWidth
                    );
                }
                ctx.closePath();
                ctx.globalAlpha = this.alpha(alpha);
                ctx.fill();
            }

            _drawTrailPiece(x0, y0, controlX, controlY, x1, y1, curved, alpha0, alpha1, progress0, progress1, baseWidth, coreAlphaMul) {
                const alpha = (alpha0 + alpha1) * 0.5;
                if (alpha <= 0.005) return;

                const startProgress = clamp(progress0, 0, 1);
                const endProgress = Math.max(startProgress, clamp(progress1, 0, 1));
                const sampleCount = this._buildTrailRibbonSamples(
                    x0, y0, controlX, controlY, x1, y1, curved, startProgress, endProgress
                );
                const progress = (startProgress + endProgress) * 0.5;
                const intensityWeight = progress * progress * (3 - 2 * progress);

                if (this.cfg.glowGain > 0) {
                    const naturalGlowWidth = baseWidth * lerp(TRAIL_TAIL_WIDTH_RATIO, 1, progress) * 1.15;
                    const glowEnergyCompensation = Math.min(1, naturalGlowWidth / Math.max(naturalGlowWidth, 2.0));
                    this._fillTrailRibbon(
                        this.trailGlowCtx, sampleCount, baseWidth, 1,
                        alpha * (0.28 + 0.62 * intensityWeight) * glowEnergyCompensation
                    );

                    const rampT = clamp((progress - 0.18) / 0.70, 0, 1);
                    const rangeRamp = rampT * rampT * (3 - 2 * rampT);
                    const fadeT = clamp((progress - 0.90) / 0.10, 0, 1);
                    const endpointFade = 1 - fadeT * fadeT * (3 - 2 * fadeT);
                    this._fillTrailRibbon(
                        this.trailHeadGlowCtx, sampleCount, baseWidth, 2,
                        alpha * rangeRamp * endpointFade * glowEnergyCompensation
                    );
                }

                this._fillTrailRibbon(this.bufferCtx, sampleCount, baseWidth, 0, alpha * coreAlphaMul);
            }

            drawTrail(nowMs) {
                if (this.trail.length < 2) return;

                const ctx = this.bufferCtx;
                const trail = this.subsystems.trail;
                const baseWidth = Math.max(0.2, (trail.widthPx ?? 1.0) * this.cfg.trailThickness);
                const hdrScale = clamp(Math.max(1.0, trail.hdrGain ?? 1.0) / 8.0, 0.6, 3.0);
                const lifeMs = Math.max(1, Math.round((trail.lifetimeSec ?? 0.3) * 1000));
                const bright = this.evalTrailGradientColor(trail, 0);
                const brightCss = rgbCss(bright);
                const coreAlphaMul = 0.50 + 0.26 * hdrScale;
                const count = this.trail.length;
                if (count > this.trailAlphaBuffer.length) {
                    this.trailAlphaBuffer = new Float32Array(count);
                    this.trailHeadProgressBuffer = new Float32Array(count);
                }

                for (let i = 0; i < count; i++) {
                    const age = clamp(this.trailPointAgeMs(this.trail[i], nowMs) / lifeMs, 0, 1);
                    const mask = this.sampleTrailTextureMask(age);
                    this.trailAlphaBuffer[i] = this.evalTrailGradientAlpha(trail, age) * mask;
                }

                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                ctx.fillStyle = brightCss;
                if (this.cfg.glowGain > 0 && this.trailGlowCtx) {
                    this.trailGlowCtx.save();
                    this.trailGlowCtx.globalCompositeOperation = "source-over";
                    this.trailGlowCtx.fillStyle = rgbCss(this.cfg.colorBase);
                }
                if (this.cfg.glowGain > 0 && this.trailHeadGlowCtx) {
                    this.trailHeadGlowCtx.save();
                    this.trailHeadGlowCtx.globalCompositeOperation = "source-over";
                    this.trailHeadGlowCtx.fillStyle = rgbCss(this.cfg.colorBase);
                }

                let strokeStart = 0;
                while (strokeStart < count) {
                    let strokeEnd = strokeStart + 1;
                    while (strokeEnd < count && !this.trail[strokeEnd].penUp) {
                        strokeEnd++;
                    }

                    const last = strokeEnd - 1;
                    for (let i = strokeStart; i <= last; i++) {
                        this.trailHeadProgressBuffer[i] = 0;
                    }
                    if (last > strokeStart) {
                        let visibleStart = strokeStart;
                        while (visibleStart <= last && this.trailAlphaBuffer[visibleStart] <= 0.005) {
                            visibleStart++;
                        }

                        if (visibleStart <= last) {
                            let visibleLength = 0;
                            this.trailHeadProgressBuffer[visibleStart] = 0;
                            for (let i = visibleStart + 1; i <= last; i++) {
                                const previous = this.trail[i - 1];
                                const point = this.trail[i];
                                visibleLength += Math.hypot(point.x - previous.x, point.y - previous.y);
                                this.trailHeadProgressBuffer[i] = visibleLength;
                            }

                            if (visibleLength > 0.001) {
                                for (let i = visibleStart; i <= last; i++) {
                                    this.trailHeadProgressBuffer[i] = clamp(this.trailHeadProgressBuffer[i] / visibleLength, 0, 1);
                                }
                            } else {
                                this.trailHeadProgressBuffer[last] = 1;
                            }
                        }
                    }

                    if (last > strokeStart) {
                        const firstPoint = this.trail[strokeStart];
                        const secondPoint = this.trail[strokeStart + 1];
                        if (last === strokeStart + 1) {
                            this._drawTrailPiece(
                                firstPoint.x, firstPoint.y, 0, 0, secondPoint.x, secondPoint.y, false,
                                this.trailAlphaBuffer[strokeStart], this.trailAlphaBuffer[last],
                                this.trailHeadProgressBuffer[strokeStart], this.trailHeadProgressBuffer[last],
                                baseWidth, coreAlphaMul
                            );
                        } else {
                            let midpointX = (firstPoint.x + secondPoint.x) * 0.5;
                            let midpointY = (firstPoint.y + secondPoint.y) * 0.5;
                            this._drawTrailPiece(
                                firstPoint.x, firstPoint.y, 0, 0, midpointX, midpointY, false,
                                this.trailAlphaBuffer[strokeStart],
                                (this.trailAlphaBuffer[strokeStart] + this.trailAlphaBuffer[strokeStart + 1]) * 0.5,
                                this.trailHeadProgressBuffer[strokeStart],
                                (this.trailHeadProgressBuffer[strokeStart] + this.trailHeadProgressBuffer[strokeStart + 1]) * 0.5,
                                baseWidth, coreAlphaMul
                            );

                            for (let i = strokeStart + 1; i < last; i++) {
                                const point = this.trail[i];
                                const next = this.trail[i + 1];
                                const nextMidpointX = (point.x + next.x) * 0.5;
                                const nextMidpointY = (point.y + next.y) * 0.5;
                                this._drawTrailPiece(
                                    midpointX, midpointY, point.x, point.y, nextMidpointX, nextMidpointY, true,
                                    (this.trailAlphaBuffer[i - 1] + this.trailAlphaBuffer[i]) * 0.5,
                                    (this.trailAlphaBuffer[i] + this.trailAlphaBuffer[i + 1]) * 0.5,
                                    (this.trailHeadProgressBuffer[i - 1] + this.trailHeadProgressBuffer[i]) * 0.5,
                                    (this.trailHeadProgressBuffer[i] + this.trailHeadProgressBuffer[i + 1]) * 0.5,
                                    baseWidth, coreAlphaMul
                                );
                                midpointX = nextMidpointX;
                                midpointY = nextMidpointY;
                            }

                            const lastPoint = this.trail[last];
                            this._drawTrailPiece(
                                midpointX, midpointY, 0, 0, lastPoint.x, lastPoint.y, false,
                                (this.trailAlphaBuffer[last - 1] + this.trailAlphaBuffer[last]) * 0.5,
                                this.trailAlphaBuffer[last],
                                (this.trailHeadProgressBuffer[last - 1] + this.trailHeadProgressBuffer[last]) * 0.5,
                                this.trailHeadProgressBuffer[last],
                                baseWidth, coreAlphaMul
                            );
                        }
                    }

                    strokeStart = strokeEnd;
                }

                if (this.cfg.glowGain > 0 && this.trailGlowCtx) {
                    this.trailGlowCtx.restore();
                }
                if (this.cfg.glowGain > 0 && this.trailHeadGlowCtx) {
                    this.trailHeadGlowCtx.restore();
                }
                ctx.restore();
            }

            _resizeTrailGlowBuffers() {
                if (!this.trailGlowCanvas || !this.trailHeadGlowCanvas || !this.trailBloomCanvas) return;

                const glowWidth = Math.max(1, Math.ceil(this.cssWidth * TRAIL_GLOW_BUFFER_SCALE));
                const glowHeight = Math.max(1, Math.ceil(this.cssHeight * TRAIL_GLOW_BUFFER_SCALE));
                for (const canvas of [this.trailGlowCanvas, this.trailHeadGlowCanvas, this.trailBloomCanvas]) {
                    if (canvas.width !== glowWidth) canvas.width = glowWidth;
                    if (canvas.height !== glowHeight) canvas.height = glowHeight;
                }
                this.trailGlowScaleX = glowWidth / this.cssWidth;
                this.trailGlowScaleY = glowHeight / this.cssHeight;
                this.trailGlowCtx.setTransform(this.trailGlowScaleX, 0, 0, this.trailGlowScaleY, 0, 0);
                this.trailHeadGlowCtx.setTransform(this.trailGlowScaleX, 0, 0, this.trailGlowScaleY, 0, 0);
                this.trailBloomCtx.setTransform(1, 0, 0, 1, 0, 0);
            }

            _ensureTrailGlowBuffers() {
                if (this.cfg.glowGain <= 0) return false;
                if (!this.trailGlowCanvas) {
                    this.trailGlowCanvas = document.createElement("canvas");
                    this.trailGlowCtx = this.trailGlowCanvas.getContext("2d");
                    this.trailHeadGlowCanvas = document.createElement("canvas");
                    this.trailHeadGlowCtx = this.trailHeadGlowCanvas.getContext("2d");
                    this.trailBloomCanvas = document.createElement("canvas");
                    this.trailBloomCtx = this.trailBloomCanvas.getContext("2d");
                    if (!this.trailGlowCtx || !this.trailHeadGlowCtx || !this.trailBloomCtx) {
                        this._releaseTrailGlowBuffers();
                        return false;
                    }
                    this._resizeTrailGlowBuffers();
                }
                return Boolean(this.trailGlowCtx && this.trailHeadGlowCtx && this.trailBloomCtx);
            }

            _releaseTrailGlowBuffers() {
                for (const canvas of [this.trailGlowCanvas, this.trailHeadGlowCanvas, this.trailBloomCanvas]) {
                    if (!canvas) continue;
                    canvas.width = 0;
                    canvas.height = 0;
                }
                this.trailGlowCanvas = null;
                this.trailGlowCtx = null;
                this.trailHeadGlowCanvas = null;
                this.trailHeadGlowCtx = null;
                this.trailBloomCanvas = null;
                this.trailBloomCtx = null;
                this.previousTrailGlowRect = null;
                this.activeTrailGlowRect = null;
            }

            _clearTrailGlowBuffers(rect = null) {
                this._clearTrailGlowBuffer(this.trailGlowCtx, this.trailGlowCanvas, rect);
                this._clearTrailGlowBuffer(this.trailHeadGlowCtx, this.trailHeadGlowCanvas, rect);
                this._clearTrailGlowBuffer(this.trailBloomCtx, this.trailBloomCanvas, rect);
            }

            _clearTrailGlowBuffer(ctx, canvas, rect) {
                if (!ctx || !canvas) return;
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                if (rect) {
                    const x0 = Math.max(0, Math.floor(rect.x * this.trailGlowScaleX) - 2);
                    const y0 = Math.max(0, Math.floor(rect.y * this.trailGlowScaleY) - 2);
                    const x1 = Math.min(canvas.width, Math.ceil((rect.x + rect.w) * this.trailGlowScaleX) + 2);
                    const y1 = Math.min(canvas.height, Math.ceil((rect.y + rect.h) * this.trailGlowScaleY) + 2);
                    ctx.clearRect(x0, y0, x1 - x0, y1 - y0);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                ctx.restore();
            }

            _prepareTrailGlowBuffers() {
                if (!this._ensureTrailGlowBuffers()) return false;

                const currentRect = this._clipRect(this._trailRect(this.trailPaddingPx()));
                if (!currentRect) return false;
                const clearRect = this.previousTrailGlowRect
                    ? this._unionRect(this.previousTrailGlowRect, currentRect)
                    : currentRect;
                this._clearTrailGlowBuffers(clearRect);
                this.activeTrailGlowRect = currentRect;
                this.previousTrailGlowRect = currentRect;
                return true;
            }

            trailPaddingPx() {
                const basePadding = 22 * this.cfg.trailThickness + 12;
                if (this.cfg.glowGain <= 0) return basePadding;

                const trail = this.subsystems.trail;
                const coreWidth = Math.max(0.2, (trail?.widthPx ?? 1.0) * this.cfg.trailThickness);
                const glowSourceHalfWidth = Math.max(coreWidth * 1.15, 2) * 0.5;
                return Math.max(basePadding, glowSourceHalfWidth + this.trailGlowSpreadPx(TRAIL_HEAD_GLOW_BLUR_PX) * 3 + 4);
            }

            _compositeTrailGlow() {
                if (this.cfg.glowGain <= 0 || this.trail.length < 2 || !this.trailGlowCtx || !this.trailHeadGlowCtx || !this.trailBloomCtx) {
                    return;
                }

                const rect = this.activeTrailGlowRect;
                if (!rect) return;

                const scaleX = this.trailGlowScaleX;
                const scaleY = this.trailGlowScaleY;
                const sx = Math.max(0, Math.floor(rect.x * scaleX));
                const sy = Math.max(0, Math.floor(rect.y * scaleY));
                const x1 = Math.min(this.trailGlowCanvas.width, Math.ceil((rect.x + rect.w) * scaleX));
                const y1 = Math.min(this.trailGlowCanvas.height, Math.ceil((rect.y + rect.h) * scaleY));
                const sw = x1 - sx;
                const sh = y1 - sy;
                if (sw <= 0 || sh <= 0) return;

                const bloomCtx = this.trailBloomCtx;
                const filterScale = (scaleX + scaleY) * 0.5;
                bloomCtx.save();
                bloomCtx.setTransform(1, 0, 0, 1, 0, 0);
                bloomCtx.globalCompositeOperation = "lighter";
                bloomCtx.imageSmoothingEnabled = true;

                bloomCtx.filter = `blur(${Math.max(0.5, this.trailGlowSpreadPx(TRAIL_HEAD_GLOW_BLUR_PX) * filterScale).toFixed(2)}px)`;
                bloomCtx.globalAlpha = clamp(0.22 * this.cfg.glowGain, 0, 0.65);
                bloomCtx.drawImage(this.trailHeadGlowCanvas, sx, sy, sw, sh, sx, sy, sw, sh);

                bloomCtx.filter = `blur(${Math.max(0.35, this.trailGlowSpreadPx(TRAIL_NEAR_GLOW_BLUR_PX) * filterScale).toFixed(2)}px)`;
                bloomCtx.globalAlpha = clamp(0.64 * this.cfg.glowGain, 0, 0.98);
                bloomCtx.drawImage(this.trailGlowCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
                bloomCtx.restore();

                const dx = sx / scaleX;
                const dy = sy / scaleY;
                const dw = sw / scaleX;
                const dh = sh / scaleY;
                const ctx = this.bufferCtx;
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                ctx.globalAlpha = 1;
                ctx.filter = "none";
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(this.trailBloomCanvas, sx, sy, sw, sh, dx, dy, dw, dh);
                if (this.cfg.glowOverdrive > 0) {
                    ctx.globalAlpha = clamp(0.24 * this.cfg.glowOverdrive, 0, 0.48);
                    ctx.drawImage(this.trailBloomCanvas, sx, sy, sw, sh, dx, dy, dw, dh);
                }
                ctx.restore();
            }

            _clearBuffer(rect) {
                const ctx = this.bufferCtx;
                if (rect) {
                    ctx.clearRect(rect.x, rect.y, rect.w, rect.h);
                } else {
                    ctx.clearRect(0, 0, this.cssWidth, this.cssHeight);
                }
            }

            _clearBufferRects(rects) {
                if (!rects || rects.length === 0) return;
                for (const rect of rects) {
                    this._clearBuffer(rect);
                }
            }

            _canvasRect() {
                return { x: 0, y: 0, w: this.cssWidth, h: this.cssHeight };
            }

            _clipRect(rect) {
                if (!rect) return null;
                const x0 = Math.max(0, Math.floor(rect.x));
                const y0 = Math.max(0, Math.floor(rect.y));
                const x1 = Math.min(this.cssWidth, Math.ceil(rect.x + rect.w));
                const y1 = Math.min(this.cssHeight, Math.ceil(rect.y + rect.h));
                if (x1 <= x0 || y1 <= y0) return null;
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            _pointRect(x, y, padding) {
                return { x: x - padding, y: y - padding, w: padding * 2, h: padding * 2 };
            }

            _trailRect(padding) {
                if (this.trail.length === 0) return null;

                let x0 = Infinity;
                let y0 = Infinity;
                let x1 = -Infinity;
                let y1 = -Infinity;
                for (const point of this.trail) {
                    x0 = Math.min(x0, point.x);
                    y0 = Math.min(y0, point.y);
                    x1 = Math.max(x1, point.x);
                    y1 = Math.max(y1, point.y);
                }

                if (!Number.isFinite(x0) || !Number.isFinite(y0) || !Number.isFinite(x1) || !Number.isFinite(y1)) {
                    return null;
                }

                return { x: x0 - padding, y: y0 - padding, w: x1 - x0 + padding * 2, h: y1 - y0 + padding * 2 };
            }

            _intersects(a, b) {
                return a.x <= b.x + b.w && a.x + a.w >= b.x && a.y <= b.y + b.h && a.y + a.h >= b.y;
            }

            _unionRect(a, b) {
                const x0 = Math.min(a.x, b.x);
                const y0 = Math.min(a.y, b.y);
                const x1 = Math.max(a.x + a.w, b.x + b.w);
                const y1 = Math.max(a.y + a.h, b.y + b.h);
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            _mergeRects(rects) {
                const merged = [];
                for (const raw of rects) {
                    let rect = this._clipRect(raw);
                    if (!rect) continue;

                    for (let i = 0; i < merged.length; i++) {
                        if (this._intersects(merged[i], rect)) {
                            rect = this._unionRect(merged[i], rect);
                            merged.splice(i, 1);
                            i = -1;
                        }
                    }
                    merged.push(rect);
                }
                return merged;
            }

            _getEffectRects() {
                const rects = [];
                const effectPad = 210 * this.cfg.globalScale + 20;
                const distancePad = 90 * this.cfg.globalScale + 20;
                const trailPad = this.trailPaddingPx();

                for (const effect of this.clickEffects) {
                    rects.push(this._pointRect(effect.x, effect.y, effectPad));
                }

                for (const effect of this.distanceEffects) {
                    rects.push(this._pointRect(effect.x, effect.y, distancePad));
                }

                if (this.trail.length > 0) {
                    const trailRect = this._trailRect(trailPad);
                    if (trailRect) rects.push(trailRect);
                }

                return this._mergeRects(rects);
            }

            _getRenderRects(currentEffectRects) {
                if (this.forceFullRedraw) {
                    return [this._canvasRect()];
                }
                return this._mergeRects(this.previousDirtyRects.concat(currentEffectRects));
            }

            _clipToRects(ctx, rects) {
                ctx.beginPath();
                for (const rect of rects) {
                    ctx.rect(rect.x, rect.y, rect.w, rect.h);
                }
                ctx.clip();
            }

            animationLoops(now) {
                if (window.renderingPaused) {
                    this.lastFrameTime = now;
                    return;
                }

                const hasWork = this.clickEffects.length > 0 || this.distanceEffects.length > 0 || this.trail.length > 0;
                if (!hasWork) {
                    this.lastFrameTime = now;
                    if (this.previousDirtyRects.length > 0) {
                        this._clearBufferRects(this.previousDirtyRects);
                        this.previousDirtyRects = [];
                    }
                    if (this.previousTrailGlowRect) {
                        this._clearTrailGlowBuffers(this.previousTrailGlowRect);
                        this.previousTrailGlowRect = null;
                        this.activeTrailGlowRect = null;
                    }
                    return;
                }

                if (this.shouldSkipTrailOnlyFrame(now)) {
                    this.lastFrameTime = now;
                    const remainingMs = Math.max(
                        1,
                        (1.0 - this.trailRenderAccumulator) * this.trailFrameIntervalMs);
