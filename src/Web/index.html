<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
            letter-spacing: 0;
        }

        html,
        body,
        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        }

        #previewPanel,
        #previewError {
            display: none;
        }

        html.preview,
        html.preview body {
            background: var(--preview-background, #000000);
        }

        html.preview #sparkCanvas {
            z-index: 2;
            pointer-events: auto;
            touch-action: none;
            cursor: crosshair;
        }

        html.preview #previewPanel {
            position: fixed;
            z-index: 4;
            top: 12px;
            right: 12px;
            bottom: 12px;
            display: block;
            width: 314px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid rgba(101, 130, 141, 0.42);
            border-radius: 6px;
            color: #edf5f7;
            background: rgba(24, 34, 39, 0.94);
            box-shadow: 0 12px 34px rgba(14, 24, 28, 0.3);
            pointer-events: auto;
        }

        html.preview #previewPanel *,
        html.preview #previewError * {
            pointer-events: auto;
        }

        .preview-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 30px;
            margin-bottom: 10px;
        }

        .preview-panel-header h1 {
            font-size: 15px;
            font-weight: 650;
        }

        .preview-panel-actions {
            display: flex;
            gap: 6px;
        }

        .preview-command {
            min-height: 28px;
            padding: 0 9px;
            border: 1px solid #50707c;
            border-radius: 4px;
            color: #dce9ed;
            background: #263940;
            cursor: pointer;
            font-size: 11px;
        }

        .preview-command:hover {
            border-color: #5fc5ff;
            color: #ffffff;
        }

        .preview-section {
            padding: 11px 0 6px;
            border-top: 1px solid rgba(169, 195, 204, 0.18);
        }

        .preview-section h2 {
            margin-bottom: 10px;
            color: #8fd8fb;
            font-size: 11px;
            font-weight: 650;
            text-transform: uppercase;
        }

        .preview-control {
            display: grid;
            grid-template-columns: 92px minmax(90px, 1fr) 48px;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            margin-bottom: 5px;
            color: #c8d7dc;
            font-size: 11px;
        }

        .preview-control output {
            color: #ffffff;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        #previewBackgroundColorValue {
            font-size: 10px;
        }

        .preview-control input[type="range"] {
            width: 100%;
            accent-color: #5fc5ff;
        }

        .preview-control input[type="color"] {
            width: 44px;
            height: 26px;
            border: 1px solid #50707c;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
        }

        .preview-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            color: #c8d7dc;
            font-size: 11px;
        }

        .preview-toggle input {
            width: 16px;
            height: 16px;
            accent-color: #5fc5ff;
        }

        #previewSplitSpeeds[hidden],
        #previewUnifiedSpeed[hidden],
        #previewRefreshControl[hidden] {
            display: none;
        }

        #previewError {
            position: fixed;
            z-index: 6;
            left: 50%;
            top: 50%;
            width: min(420px, calc(100% - 32px));
            padding: 16px;
            transform: translate(-50%, -50%);
            border: 1px solid #d46a62;
            border-radius: 6px;
            color: #ffffff;
            background: rgba(44, 28, 29, 0.96);
            font-size: 12px;
            pointer-events: auto;
        }

        html.preview.render-error #previewError {
            display: block;
        }

        @media (max-width: 760px) {
            html.preview #previewPanel {
                top: auto;
                left: 8px;
                right: 8px;
                bottom: 8px;
                width: auto;
                max-height: 46vh;
            }

            .preview-control {
                grid-template-columns: 86px minmax(80px, 1fr) 44px;
            }
        }
    </style>
</head>
<body>
    <canvas id="sparkCanvas"></canvas>
    <aside id="previewPanel" aria-label="视觉表现设置">
        <header class="preview-panel-header">
            <h1>视觉表现</h1>
            <div class="preview-panel-actions">
                <button id="previewReset" class="preview-command" type="button">恢复默认</button>
            </div>
        </header>
        <section class="preview-section">
            <h2>画面</h2>
            <label class="preview-control">
                <span>背景颜色</span>
                <input id="previewBackgroundColor" type="color" value="#000000">
                <output id="previewBackgroundColorValue">#000000</output>
            </label>
            <label class="preview-control">
                <span>主题颜色</span>
                <input id="previewColor" type="color" value="#5fc5ff">
                <output id="previewColorValue">95,197,255</output>
            </label>
        </section>
        <section class="preview-section">
            <h2>尺寸与合成</h2>
            <label class="preview-control"><span>缩放比例</span><input id="previewScale" type="range" min="0.50" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>拖尾粗细</span><input id="previewThickness" type="range" min="0.50" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>发光强度</span><input id="previewGlow" type="range" min="0.00" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-control"><span>不透明度</span><input id="previewOpacity" type="range" min="0.10" max="1.00" step="0.10" value="1.00"><output>1.00x</output></label>
        </section>
        <section class="preview-section">
            <h2>动画</h2>
            <label class="preview-toggle"><input id="previewLinkedSpeed" type="checkbox" checked><span>拖尾与点击使用同一速度</span></label>
            <label id="previewUnifiedSpeed" class="preview-control"><span>动画速度</span><input id="previewSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <div id="previewSplitSpeeds" hidden>
                <label class="preview-control"><span>拖尾速度</span><input id="previewTrailSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
                <label class="preview-control"><span>点击速度</span><input id="previewClickSpeed" type="range" min="0.20" max="3.00" step="0.10" value="1.00"><output>1.00x</output></label>
            </div>
            <label class="preview-control"><span>拖尾延迟倍数</span><input id="previewLifetime" type="range" min="0.00" max="2.00" step="0.10" value="1.00"><output>1.00x</output></label>
            <label class="preview-toggle"><input id="previewFollowRefresh" type="checkbox" checked><span>拖尾刷新率跟随显示器</span></label>
            <label id="previewRefreshControl" class="preview-control" hidden><span>拖尾刷新率</span><input id="previewRefresh" type="range" min="30" max="360" step="10" value="60"><output>60 Hz</output></label>
        </section>
    </aside>
    <div id="previewError" role="alert"><strong>渲染器启动失败</strong><div id="previewErrorMessage"></div></div>
    <!-- BASPARK_ASSET_BOOTSTRAP -->
    <script>
        (() => {
            "use strict";

            const IS_PREVIEW = window.__BASPARK_STANDALONE_PREVIEW__ === true ||
                new URLSearchParams(location.search).has("preview");
            if (IS_PREVIEW) {
                document.documentElement.classList.add("preview");
            }

            const TAU = Math.PI * 2;
            const DEFAULT_COLOR_TEXT = "95,197,255";
            const DEFAULT_COLOR = [95 / 255, 197 / 255, 1];
            const TRAIL_LIFETIME_MS = 300.00001192092896;
            const TRAIL_WIDTH_WORLD = 0.004999999888241291;
            const TRAIL_MIN_VERTEX_WORLD = 0.009999999776482582;
            const TRAIL_SMOOTHING_PASSES = 3;
            const TRAIL_RENDER_SEGMENT_PX = 0.5;
            const TRAIL_MSAA_SAMPLES = 4;
            const EFFECT_RENDER_SCALE = 0.5;
            const TRAIL_RENDER_WIDTH_SCALE = 0.5;
            const DISTANCE_RATE_PER_WORLD = 5;
            const DISC_HDR = 2;
            const PARTICLE_HDR = 5.992156982421875;
            const TRAIL_HDR = 23.9686279296875;
            const BLOOM_RESOURCE_INTENSITY = 1.7000000476837158;
            const BLOOM_BASE_STRENGTH = 0.05;
            const BLOOM_RADIUS_CALIBRATION = 0.25;
            const BLOOM_THRESHOLD = 1;
            const BLOOM_DIFFUSION = 7;
            const MAX_BLOOM_LEVELS = 16;
            const MAX_CLICK_EFFECTS = 16;
            const MAX_DISTANCE_PARTICLES = 50;
            const MAX_TRAIL_POINTS = 512;

            const PROFILE = Object.freeze({
                disc: {
                    lifetimeMs: 200,
                    size: 0.12,
                    sizeMultiplier: 2,
                    sizeCurve: [
                        { t: 0, v: 0.32583582401275635, i: 2.4004733562469482, o: 2.4004733562469482 },
                        { t: 0.21392822265625, v: 0.7159773111343384, i: 0.9115744829177856, o: 0.9115744829177856 },
                        { t: 1, v: 1, i: 0, o: 0 }
                    ],
                    color: [
                        { t: 0, c: [1, 1, 1] },
                        { t: 7903 / 65535, c: [0.24056601524353027, 0.39061814546585083, 1] },
                        { t: 1, c: [0.24056601524353027, 0.39061814546585083, 1] }
                    ],
                    alpha: [
                        { t: 0, v: 1 },
                        { t: 7132 / 65535, v: 1 },
                        { t: 1, v: 0 }
                    ]
                },
                clickTriangles: {
                    count: 4,
                    lifetime: [0.6, 0.7],
                    speed: [0.3, 0.4],
                    size: [0.1, 0.2],
                    localScale: 0.3078823983669281,
                    shapeScale: 0.30000001192092896
                },
                distanceTriangles: {
                    lifetime: [0.2, 0.4],
                    speed: [0.2, 0.3],
                    size: [0.1, 0.2],
                    localScale: 0.3078823983669281,
                    shapeScale: 0.15000000596046448
                },
                triangleSize: [
                    { t: 0, v: 0, i: 0, o: 0 },
                    { t: 0.15445095300674438, v: 1, i: 0, o: 0 },
                    { t: 1, v: 0, i: -2.1621501445770264, o: -2.1621501445770264 }
                ],
                triangleColor: [
                    { t: 11951 / 65535, c: [1, 1, 1] },
                    { t: 18504 / 65535, c: [0.37264150381088257, 0.7731872797012329, 1] },
                    { t: 30262 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1] },
                    { t: 43369 / 65535, c: [0.3529411852359772, 0.729411780834198, 0.9450981020927429] },
                    { t: 54163 / 65535, c: [0.37254902720451355, 0.7725490927696228, 1] },
                    { t: 1, c: [0.37254902720451355, 0.7725490927696228, 1] }
                ],
                triangleAlpha: [
                    { t: 18890 / 65535, v: 1 },
                    { t: 23901 / 65535, v: 0 },
                    { t: 30840 / 65535, v: 1 },
                    { t: 37586 / 65535, v: 0 },
                    { t: 43754 / 65535, v: 1 },
                    { t: 49537 / 65535, v: 0 },
                    { t: 55898 / 65535, v: 1 },
                    { t: 1, v: 1 }
                ],
                triangleBrightness: [0.53773582, 1],
                mesh: {
                    count: 2,
                    lifetimeMs: 600,
                    size: [0.12, 0.14],
                    outerRadius: 1.06366865045,
                    rotationScalar: 11.170106887817383,
                    sizeCurve: [
                        { t: 0.00720977783203125, v: 0.4205089807510376, i: 2.4004733562469482, o: 2.4004733562469482 },
                        { t: 0.21392822265625, v: 0.7159773111343384, i: 0.9115744829177856, o: 0.9115744829177856 },
                        { t: 1, v: 1, i: 0, o: 0 }
                    ],
                    custom: [
                        { t: 0, v: 1, i: 0, o: 0 },
                        { t: 0.20000000298023224, v: 0, i: 0, o: 2.4249367713928223 },
                        { t: 1, v: 1, i: 0.27735635638237, o: 0.27735635638237 }
                    ],
                    rotationMin: [
                        { t: 0.14903903007507324, v: 1, i: 0, o: 0 },
                        { t: 1, v: 0.4556182622909546, i: 0, o: 0 }
                    ],
                    rotationMax: [
                        { t: 0.1586538404226303, v: 0.7988165616989136, i: 0, o: 0 },
                        { t: 1, v: -0.0650913417339325, i: 0, o: 0 }
                    ],
                    color: [
                        { t: 7325 / 65535, c: [1, 1, 1] },
                        { t: 32768 / 65535, c: [0.2971698045730591, 0.6532865166664124, 1] },
                        { t: 1, c: [0, 0.08176128566265106, 0.801886796951294] }
                    ]
                },
                trailColor: [
                    { t: 0, c: [0, 0, 0] },
                    { t: 1 - 0.420584, c: [0, 87 / 255, 145 / 255] },
                    { t: 1 - 0.020584, c: [0, 168 / 255, 1] },
                    { t: 1, c: [0, 168 / 255, 1] }
                ]
            });

            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
            const lerp = (a, b, t) => a + (b - a) * t;
            const randomRange = (a, b) => a + (b - a) * Math.random();

            function smoothTrailPath(source, renderSegmentPx) {
                if (source.length < 3) return source;
                let points = source;
                for (let pass = 0; pass < TRAIL_SMOOTHING_PASSES; pass++) {
                    const refined = [points[0]];
                    for (let index = 0; index < points.length - 1; index++) {
                        const a = points[index];
                        const b = points[index + 1];
                        refined.push({
                            x: lerp(a.x, b.x, 0.25),
                            y: lerp(a.y, b.y, 0.25),
                            born: lerp(a.born, b.born, 0.25)
                        });
                        refined.push({
                            x: lerp(a.x, b.x, 0.75),
                            y: lerp(a.y, b.y, 0.75),
                            born: lerp(a.born, b.born, 0.75)
                        });
                    }
                    refined.push(points[points.length - 1]);
                    points = refined;
                }

                const resampled = [points[0]];
                for (let index = 1; index < points.length; index++) {
                    const a = points[index - 1];
                    const b = points[index];
                    const distance = Math.hypot(b.x - a.x, b.y - a.y);
                    const segmentCount = Math.max(1, Math.ceil(distance / renderSegmentPx));
                    for (let segment = 1; segment <= segmentCount; segment++) {
                        const t = segment / segmentCount;
                        resampled.push({
                            x: lerp(a.x, b.x, t),
                            y: lerp(a.y, b.y, t),
                            born: lerp(a.born, b.born, t)
                        });
                    }
                }
                return resampled;
            }

            function evalCurve(stops, t, fallback = 1) {
                if (!stops || stops.length === 0) return fallback;
                if (t <= stops[0].t) return stops[0].v;
                for (let index = 1; index < stops.length; index++) {
                    const b = stops[index];
                    if (t <= b.t) {
                        const a = stops[index - 1];
                        const dt = Math.max(0.000001, b.t - a.t);
                        const s = clamp((t - a.t) / dt, 0, 1);
                        if (!Number.isFinite(a.o) || !Number.isFinite(b.i)) return lerp(a.v, b.v, s);
                        const s2 = s * s;
                        const s3 = s2 * s;
                        return (2 * s3 - 3 * s2 + 1) * a.v +
                            (s3 - 2 * s2 + s) * dt * a.o +
                            (-2 * s3 + 3 * s2) * b.v +
                            (s3 - s2) * dt * b.i;
                    }
                }
                return stops[stops.length - 1].v;
            }

            // Unity Gradient alpha keys are linearly interpolated, unlike AnimationCurve keys.
            function evalGradientAlpha(stops, t) {
                if (t <= stops[0].t) return stops[0].v;
                for (let index = 1; index < stops.length; index++) {
                    const b = stops[index];
                    if (t <= b.t) {
                        const a = stops[index - 1];
                        const p = clamp((t - a.t) / Math.max(0.000001, b.t - a.t), 0, 1);
                        return lerp(a.v, b.v, p);
                    }
                }
                return stops[stops.length - 1].v;
            }

            function evalColor(stops, t) {
                if (t <= stops[0].t) return stops[0].c;
                for (let index = 1; index < stops.length; index++) {
                    const b = stops[index];
                    if (t <= b.t) {
                        const a = stops[index - 1];
                        const p = clamp((t - a.t) / Math.max(0.000001, b.t - a.t), 0, 1);
                        return [
                            lerp(a.c[0], b.c[0], p),
                            lerp(a.c[1], b.c[1], p),
                            lerp(a.c[2], b.c[2], p)
                        ];
                    }
                }
                return stops[stops.length - 1].c;
            }

            function parseRgb(text) {
                const parts = `${text}`.split(",").map(value => Number.parseInt(value.trim(), 10));
                if (parts.length !== 3 || parts.some(value => !Number.isFinite(value))) return DEFAULT_COLOR.slice();
                return parts.map(value => clamp(value, 0, 255) / 255);
            }

            function colorsEqual(a, b) {
                return Math.abs(a[0] - b[0]) < 0.5 / 255 &&
                    Math.abs(a[1] - b[1]) < 0.5 / 255 &&
                    Math.abs(a[2] - b[2]) < 0.5 / 255;
            }

            function srgbChannelToLinear(value) {
                return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
            }

            function linearColor(color) {
                return color.map(srgbChannelToLinear);
            }

            class TouchEngine {
                constructor() {
                    this.width = 1;
                    this.height = 1;
                    this.worldToPx = 0.5;
                    this.colorText = DEFAULT_COLOR_TEXT;
                    this.themeColor = DEFAULT_COLOR.slice();
                    this.nativeTheme = true;
                    this.scale = 1;
                    this.opacity = 1;
                    this.trailSpeed = 1;
                    this.clickSpeed = 1;
                    this.trailThickness = 1;
                    this.trailLifetimeMultiplier = 1;
                    this.glowIntensity = 1;
                    this.trailRefreshRate = 60;
                    this.clicks = [];
                    this.distanceParticles = [];
                    this.trail = [];
                    this.down = false;
                    this.lastRaw = null;
                    this.trailEmit = null;
                    this.trailTip = null;
                    this.distanceAccumulator = 0;
                    this.strokeId = 0;
                    this.testClock = null;
                }

                now() {
                    return this.testClock == null ? performance.now() : this.testClock;
                }

                resize(width, height) {
                    const nextWidth = Math.max(1, width);
                    const nextHeight = Math.max(1, height);
                    const changed = nextWidth !== this.width || nextHeight !== this.height;
                    this.width = nextWidth;
                    this.height = nextHeight;
                    this.worldToPx = this.height / 2;
                    if (changed) this.clear();
                }

                setColor(text) {
                    this.colorText = text || DEFAULT_COLOR_TEXT;
                    this.themeColor = parseRgb(this.colorText);
                    this.nativeTheme = colorsEqual(this.themeColor, DEFAULT_COLOR);
                }

                displayColor(nativeColor) {
                    return this.nativeTheme ? nativeColor : this.themeColor;
                }

                clear() {
                    this.clicks.length = 0;
                    this.distanceParticles.length = 0;
                    this.trail.length = 0;
                    this.down = false;
                    this.lastRaw = null;
                    this.trailEmit = null;
                    this.trailTip = null;
                    this.distanceAccumulator = 0;
                }

                truncateTrail() {
                    this.commitTrailTip();
                    this.down = false;
                    this.lastRaw = null;
                    this.trailEmit = null;
                    this.trailTip = null;
                    this.distanceAccumulator = 0;
                }

                pointerDown(x, y, time = this.now()) {
                    this.down = true;
                    this.lastRaw = { x, y, time };
                    this.distanceAccumulator = 0;
                    this.beginStroke(x, y, time);
                    this.spawnClick(x, y, time);
                }

                beginTrailStrokeOnly(x, y, pointerDown, time = this.now()) {
                    this.down = Boolean(pointerDown);
                    this.lastRaw = { x, y, time };
                    this.distanceAccumulator = 0;
                    this.beginStroke(x, y, time);
                }

                pointerMove(x, y, time = this.now()) {
                    if (!this.down && !window.effectiveAlwaysTrail) return;
                    if (!this.lastRaw) {
                        this.beginTrailStrokeOnly(x, y, this.down, time);
                        return;
                    }

                    const start = this.lastRaw;
                    this.emitTrailTo(x, y, time);
                    if (this.down) this.emitDistanceParticles(start, x, y, time);
                    this.lastRaw = { x, y, time };
                }

                pointerUp() {
                    this.down = false;
                    this.distanceAccumulator = 0;
                    if (!window.effectiveAlwaysTrail) {
                        this.commitTrailTip();
                        this.lastRaw = null;
                        this.trailEmit = null;
                        this.trailTip = null;
                    }
                }

                beginStroke(x, y, time) {
                    this.strokeId++;
                    this.appendTrail(x, y, time, this.strokeId);
                    this.trailEmit = { x, y, time };
                    this.trailTip = { x, y, born: time, strokeId: this.strokeId };
                }

                commitTrailTip() {
                    const tip = this.trailTip;
                    if (!tip) return;
                    const last = this.trail[this.trail.length - 1];
                    if (!last || last.strokeId !== tip.strokeId ||
                        Math.hypot(last.x - tip.x, last.y - tip.y) >= 0.05) {
                        this.appendTrail(tip.x, tip.y, tip.born, tip.strokeId);
                    }
                }

                appendTrail(x, y, born, strokeId) {
                    const last = this.trail[this.trail.length - 1];
                    if (last && last.strokeId === strokeId && Math.hypot(last.x - x, last.y - y) < 0.05) {
                        last.x = x;
                        last.y = y;
                        last.born = born;
                        return;
                    }
                    this.trail.push({ x, y, born, strokeId });
                    if (this.trail.length > MAX_TRAIL_POINTS) {
                        this.trail.splice(0, this.trail.length - MAX_TRAIL_POINTS);
                    }
                }

                emitTrailTo(x, y, time) {
                    if (!this.trailEmit) {
                        this.beginStroke(x, y, time);
                        return;
                    }

                    this.trailTip = { x, y, born: time, strokeId: this.strokeId };
                    const origin = this.trailEmit;
                    const dx = x - origin.x;
                    const dy = y - origin.y;
                    const distance = Math.hypot(dx, dy);
                    const spacing = TRAIL_MIN_VERTEX_WORLD * this.worldToPx;
                    if (distance < spacing) return;

                    const count = Math.floor(distance / spacing);
                    for (let index = 1; index <= count; index++) {
                        const p = clamp(index * spacing / distance, 0, 1);
                        const point = {
                            x: origin.x + dx * p,
                            y: origin.y + dy * p,
                            time: lerp(origin.time, time, p)
                        };
                        this.appendTrail(point.x, point.y, point.time, this.strokeId);
                        this.trailEmit = point;
                    }
                }

                emitDistanceParticles(start, x, y, time) {
                    const dx = x - start.x;
                    const dy = y - start.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance <= 0) return;

                    const step = this.worldToPx / DISTANCE_RATE_PER_WORLD;
                    let remaining = distance;
                    let travelled = 0;
                    let needed = step - this.distanceAccumulator;
                    while (remaining + 0.000001 >= needed) {
                        travelled += needed;
                        remaining -= needed;
                        const p = clamp(travelled / distance, 0, 1);
                        const born = lerp(start.time, time, p);
                        this.distanceParticles.push(this.makeTriangle(
                            PROFILE.distanceTriangles,
                            start.x + dx * p,
                            start.y + dy * p,
                            born
                        ));
                        if (this.distanceParticles.length > MAX_DISTANCE_PARTICLES) this.distanceParticles.shift();
                        this.distanceAccumulator = 0;
                        needed = step;
                    }
                    this.distanceAccumulator += Math.max(0, remaining);
                }

                makeTriangle(profile, x, y, born) {
                    const fixedFrame = Math.floor(((randomRange(0, 0.5) + randomRange(0, 0.5)) % 1) * 2);
                    return {
                        x,
                        y,
                        born,
                        direction: randomRange(0, TAU),
                        frame: fixedFrame,
                        brightness: randomRange(PROFILE.triangleBrightness[0], PROFILE.triangleBrightness[1]),
                        lifetimeMs: randomRange(profile.lifetime[0], profile.lifetime[1]) * 1000,
                        speed: randomRange(profile.speed[0], profile.speed[1]),
                        size: randomRange(profile.size[0], profile.size[1]),
                        localScale: profile.localScale,
                        shapeScale: profile.shapeScale
                    };
                }

                spawnClick(x, y, born) {
                    const triangles = [];
                    for (let index = 0; index < PROFILE.clickTriangles.count; index++) {
                        triangles.push(this.makeTriangle(PROFILE.clickTriangles, x, y, born));
                    }
                    const arcs = [];
                    for (let index = 0; index < PROFILE.mesh.count; index++) {
                        arcs.push({
                            angle: randomRange(0, TAU),
                            rotationMix: Math.random(),
                            startSize: randomRange(PROFILE.mesh.size[0], PROFILE.mesh.size[1])
                        });
                    }
                    this.clicks.push({ x, y, born, triangles, arcs });
                    if (this.clicks.length > MAX_CLICK_EFFECTS) this.clicks.shift();
                }

                prune(now) {
                    this.clicks = this.clicks.filter(click => {
                        const triangleEnd = click.triangles.reduce(
                            (longest, triangle) => Math.max(longest, triangle.lifetimeMs),
                            PROFILE.mesh.lifetimeMs
                        );
                        return (now - click.born) * this.clickSpeed <= triangleEnd;
                    });
                    this.distanceParticles = this.distanceParticles.filter(
                        particle => (now - particle.born) * this.trailSpeed <= particle.lifetimeMs
                    );

                    const lifetime = TRAIL_LIFETIME_MS * this.trailLifetimeMultiplier;
                    if (lifetime <= 0) {
                        this.trail.length = 0;
                    } else {
                        const cutoff = now - lifetime / this.trailSpeed - 100;
                        let firstUseful = 0;
                        while (firstUseful + 1 < this.trail.length && this.trail[firstUseful + 1].born < cutoff) {
                            firstUseful++;
                        }
                        if (firstUseful > 0) this.trail.splice(0, firstUseful);
                    }
                }

                hasActiveEffects(now) {
                    this.prune(now);
                    return this.down || window.effectiveAlwaysTrail || this.clicks.length > 0 ||
                        this.distanceParticles.length > 0 || this.trail.length > 1;
                }

                trailStrokes(now) {
                    const lifetime = TRAIL_LIFETIME_MS * this.trailLifetimeMultiplier;
                    if (lifetime <= 0 || this.trail.length === 0) return [];
                    const cutoff = now - lifetime / this.trailSpeed;
                    const groups = new Map();
                    for (const point of this.trail) {
                        if (!groups.has(point.strokeId)) groups.set(point.strokeId, []);
                        groups.get(point.strokeId).push(point);
                    }

                    const result = [];
                    for (const [strokeId, source] of groups) {
                        const emitted = source.filter(point => point.born <= now);
                        const tip = this.trailTip;
                        const last = emitted[emitted.length - 1];
                        if (tip && tip.strokeId === strokeId && tip.born <= now &&
                            (!last || Math.hypot(last.x - tip.x, last.y - tip.y) >= 0.05)) {
                            emitted.push(tip);
                        }
                        if (emitted.length < 2 || emitted[emitted.length - 1].born < cutoff) continue;
                        let firstAlive = emitted.findIndex(point => point.born >= cutoff);
                        if (firstAlive < 0) continue;
                        const points = [];
                        if (firstAlive > 0) {
                            const a = emitted[firstAlive - 1];
                            const b = emitted[firstAlive];
                            const p = clamp((cutoff - a.born) / Math.max(0.001, b.born - a.born), 0, 1);
                            points.push({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), born: cutoff });
                        }
                        points.push(...emitted.slice(firstAlive));
                        if (points.length >= 2) result.push(points);
                    }
                    return result;
                }
            }

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    const message = gl.getShaderInfoLog(shader) || "Unknown shader compile error";
                    gl.deleteShader(shader);
                    throw new Error(message);
                }
                return shader;
            }

            function createProgram(gl, vertexSource, fragmentSource) {
                const program = gl.createProgram();
                const vertex = createShader(gl, gl.VERTEX_SHADER, vertexSource);
                const fragment = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
                gl.attachShader(program, vertex);
                gl.attachShader(program, fragment);
                gl.linkProgram(program);
                gl.deleteShader(vertex);
                gl.deleteShader(fragment);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    const message = gl.getProgramInfoLog(program) || "Unknown shader link error";
                    gl.deleteProgram(program);
                    throw new Error(message);
                }
                return program;
            }

            const SPRITE_VERTEX = `#version 300 es
                precision highp float;
                layout(location=0) in vec2 aCorner;
                uniform vec2 uCenter;
                uniform vec2 uSize;
                uniform vec2 uResolution;
                uniform vec4 uUvRect;
                uniform float uRotation;
                out vec2 vUv;
                void main() {
                    float c = cos(uRotation);
                    float s = sin(uRotation);
                    vec2 local = aCorner * uSize;
                    vec2 position = uCenter + vec2(c * local.x - s * local.y, s * local.x + c * local.y);
                    vec2 clip = vec2(position.x / uResolution.x * 2.0 - 1.0, 1.0 - position.y / uResolution.y * 2.0);
                    gl_Position = vec4(clip, 0.0, 1.0);
                    vec2 spriteUv = vec2(aCorner.x + 0.5, 0.5 - aCorner.y);
                    vUv = uUvRect.xy + spriteUv * uUvRect.zw;
                }`;

            const SPRITE_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                uniform float uAlpha;
                uniform float uGain;
                in vec2 vUv;
                out vec4 outColor;
                void main() {
                    vec4 texel = texture(uTexture, vUv);
                    float mask = max(max(texel.r, texel.g), texel.b) * texel.a;
                    float alpha = mask * uAlpha;
                    outColor = vec4(uColor * (uGain * alpha), alpha);
                }`;

            const GEOMETRY_VERTEX = `#version 300 es
                precision highp float;
                layout(location=0) in vec2 aPosition;
                layout(location=1) in vec2 aUv;
                layout(location=2) in vec4 aColor;
                uniform vec2 uResolution;
                out vec2 vUv;
                out vec4 vColor;
                void main() {
                    vec2 clip = vec2(aPosition.x / uResolution.x * 2.0 - 1.0, 1.0 - aPosition.y / uResolution.y * 2.0);
                    gl_Position = vec4(clip, 0.0, 1.0);
                    vUv = aUv;
                    vColor = aColor;
                }`;

            const GEOMETRY_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uTexture;
                uniform float uGain;
                in vec2 vUv;
                in vec4 vColor;
                out vec4 outColor;
                void main() {
                    vec4 texel = texture(uTexture, vUv);
                    float mask = max(max(texel.r, texel.g), texel.b) * texel.a;
                    float alpha = mask * vColor.a;
                    outColor = vec4(vColor.rgb * (uGain * alpha), alpha);
                }`;

            const FULLSCREEN_VERTEX = `#version 300 es
                precision highp float;
                out vec2 vUv;
                void main() {
                    vec2 uv = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
                    vUv = uv;
                    gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
                }`;

            const PREFILTER_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uTexture;
                uniform vec2 uTexel;
                uniform float uThreshold;
                in vec2 vUv;
                out vec4 outColor;
                vec3 sampleBox4(sampler2D image, vec2 uv, vec2 texel) {
                    vec3 color = texture(image, uv + texel * vec2(-1.0, -1.0)).rgb;
                    color += texture(image, uv + texel * vec2( 1.0, -1.0)).rgb;
                    color += texture(image, uv + texel * vec2(-1.0,  1.0)).rgb;
                    color += texture(image, uv + texel * vec2( 1.0,  1.0)).rgb;
                    return color * 0.25;
                }
                void main() {
                    vec3 color = min(sampleBox4(uTexture, vUv, uTexel), vec3(65472.0));
                    float brightness = max(max(color.r, color.g), color.b);
                    float contribution = max(brightness - uThreshold, 0.0) / max(brightness, 0.00001);
                    outColor = vec4(color * contribution, 0.0);
                }`;

            const DOWNSAMPLE_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uTexture;
                uniform vec2 uTexel;
                in vec2 vUv;
                out vec4 outColor;
                vec3 sampleBox4(sampler2D image, vec2 uv, vec2 texel) {
                    vec3 color = texture(image, uv + texel * vec2(-1.0, -1.0)).rgb;
                    color += texture(image, uv + texel * vec2( 1.0, -1.0)).rgb;
                    color += texture(image, uv + texel * vec2(-1.0,  1.0)).rgb;
                    color += texture(image, uv + texel * vec2( 1.0,  1.0)).rgb;
                    return color * 0.25;
                }
                void main() {
                    outColor = vec4(sampleBox4(uTexture, vUv, uTexel), 0.0);
                }`;

            const UPSAMPLE_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uHigh;
                uniform sampler2D uLow;
                uniform vec2 uLowTexel;
                uniform float uSampleScale;
                in vec2 vUv;
                out vec4 outColor;
                vec3 sampleTent4(sampler2D image, vec2 uv, vec2 texel) {
                    vec2 offset = texel * (uSampleScale * 0.5);
                    vec3 color = texture(image, uv + offset * vec2(-1.0, -1.0)).rgb;
                    color += texture(image, uv + offset * vec2( 1.0, -1.0)).rgb;
                    color += texture(image, uv + offset * vec2(-1.0,  1.0)).rgb;
                    color += texture(image, uv + offset * vec2( 1.0,  1.0)).rgb;
                    return color * 0.25;
                }
                void main() {
                    outColor = vec4(texture(uHigh, vUv).rgb +
                        sampleTent4(uLow, vUv, uLowTexel), 0.0);
                }`;

            const FINAL_FRAGMENT = `#version 300 es
                precision highp float;
                uniform sampler2D uSource;
                uniform sampler2D uBloom;
                uniform sampler2D uDiscMask;
                uniform float uBloomStrength;
                uniform vec2 uBloomTexel;
                uniform float uSampleScale;
                in vec2 vUv;
                out vec4 outColor;
                vec3 linearToSrgb(vec3 value) {
                    vec3 lo = value * 12.92;
                    vec3 hi = 1.055 * pow(max(value, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055;
                    return mix(hi, lo, lessThanEqual(value, vec3(0.0031308)));
                }
                vec3 sampleBloom(vec2 uv) {
                    vec2 offset = uBloomTexel * (uSampleScale * 0.5);
                    vec3 color = texture(uBloom, uv + offset * vec2(-1.0, -1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2( 1.0, -1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2(-1.0,  1.0)).rgb;
                    color += texture(uBloom, uv + offset * vec2( 1.0,  1.0)).rgb;
                    return color * 0.25;
                }
                void main() {
                    vec4 source = texture(uSource, vUv);
                    vec3 bloom = sampleBloom(vUv) * uBloomStrength;
                    vec3 hdr = max(source.rgb + bloom, vec3(0.0));
                    vec3 srgb = linearToSrgb(hdr);
                    float effectCoverage = clamp(max(max(srgb.r, srgb.g), srgb.b), 0.0, 1.0);
                    float sourceCoverage = clamp(source.a, 0.0, 1.0);
                    float effectAlpha = 1.0 - (1.0 - sourceCoverage) * (1.0 - effectCoverage);
                    float discCoverage = texture(uDiscMask, vUv).r;
                    float discMask = step(0.0001, discCoverage);
                    float alpha = mix(effectAlpha, discCoverage, discMask);
                    outColor = vec4(min(srgb, vec3(alpha)), alpha);
                }`;

            class WebGlRenderer {
                constructor(canvas, engine, images) {
                    this.canvas = canvas;
                    this.engine = engine;
                    this.gl = canvas.getContext("webgl2", {
                        alpha: true,
                        antialias: false,
                        depth: false,
                        stencil: false,
                        premultipliedAlpha: true,
                        preserveDrawingBuffer: false,
                        powerPreference: "high-performance"
                    });
                    if (!this.gl) throw new Error("WebGL2 is unavailable");
                    this.floatTargets = Boolean(this.gl.getExtension("EXT_color_buffer_float"));
                    this.floatLinear = Boolean(this.gl.getExtension("OES_texture_float_linear"));
                    if (!this.floatLinear) this.floatTargets = false;
                    this.cssWidth = 1;
                    this.cssHeight = 1;
                    this.dpr = 1;
                    this.targets = [];
                    this.msaaTargets = [];
                    this.sourceMsaaTarget = null;
                    this.msaaSamples = 1;
                    this.initPrograms();
                    this.initBuffers();
                    this.textures = {
                        circle: this.createImageTexture(images.circle),
                        ring: this.createImageTexture(images.ring),
                        trail: this.createImageTexture(images.trail),
                        triangle: this.createImageTexture(images.triangle)
                    };
                    this.resize();
                }

                initPrograms() {
                    const gl = this.gl;
                    this.spriteProgram = createProgram(gl, SPRITE_VERTEX, SPRITE_FRAGMENT);
                    this.geometryProgram = createProgram(gl, GEOMETRY_VERTEX, GEOMETRY_FRAGMENT);
                    this.prefilterProgram = createProgram(gl, FULLSCREEN_VERTEX, PREFILTER_FRAGMENT);
                    this.downsampleProgram = createProgram(gl, FULLSCREEN_VERTEX, DOWNSAMPLE_FRAGMENT);
                    this.upsampleProgram = createProgram(gl, FULLSCREEN_VERTEX, UPSAMPLE_FRAGMENT);
                    this.finalProgram = createProgram(gl, FULLSCREEN_VERTEX, FINAL_FRAGMENT);
                }

                initBuffers() {
                    const gl = this.gl;
                    this.spriteVao = gl.createVertexArray();
                    gl.bindVertexArray(this.spriteVao);
                    const quad = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                        -0.5, -0.5, 0.5, -0.5, -0.5, 0.5,
                        -0.5, 0.5, 0.5, -0.5, 0.5, 0.5
                    ]), gl.STATIC_DRAW);
                    gl.enableVertexAttribArray(0);
                    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);

                    this.geometryVao = gl.createVertexArray();
                    this.geometryBuffer = gl.createBuffer();
                    gl.bindVertexArray(this.geometryVao);
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.geometryBuffer);
                    gl.enableVertexAttribArray(0);
                    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 32, 0);
                    gl.enableVertexAttribArray(1);
                    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 32, 8);
                    gl.enableVertexAttribArray(2);
                    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);

                    this.fullscreenVao = gl.createVertexArray();
                    gl.bindVertexArray(null);
                }

                createImageTexture(image) {
                    const gl = this.gl;
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, image);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    return texture;
                }

                createTarget(width, height) {
                    const gl = this.gl;
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    const internalFormat = this.floatTargets ? gl.RGBA16F : gl.RGBA8;
                    const type = this.floatTargets ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
                    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, gl.RGBA, type, null);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    const framebuffer = gl.createFramebuffer();
                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                        throw new Error("Touch effect framebuffer is incomplete");
                    }
                    const target = { texture, framebuffer, width, height };
                    this.targets.push(target);
                    return target;
                }

                createMaskTarget(width, height) {
                    const gl = this.gl;
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, width, height, 0, gl.RED, gl.UNSIGNED_BYTE, null);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    const framebuffer = gl.createFramebuffer();
                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                        throw new Error("Touch effect mask framebuffer is incomplete");
                    }
                    const target = { texture, framebuffer, width, height };
                    this.targets.push(target);
                    return target;
                }

                createMultisampleTarget(width, height) {
                    const gl = this.gl;
                    const samples = Math.min(
                        TRAIL_MSAA_SAMPLES,
                        Math.max(1, Number(gl.getParameter(gl.MAX_SAMPLES)) || 1)
                    );
                    if (samples < 2) return null;

                    const framebuffer = gl.createFramebuffer();
                    const colorBuffer = gl.createRenderbuffer();
                    if (!framebuffer || !colorBuffer) return null;

                    const internalFormat = this.floatTargets ? gl.RGBA16F : gl.RGBA8;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
                    gl.bindRenderbuffer(gl.RENDERBUFFER, colorBuffer);
                    gl.renderbufferStorageMultisample(
                        gl.RENDERBUFFER,
                        samples,
                        internalFormat,
                        width,
                        height
                    );
                    gl.framebufferRenderbuffer(
                        gl.FRAMEBUFFER,
                        gl.COLOR_ATTACHMENT0,
                        gl.RENDERBUFFER,
                        colorBuffer
                    );
                    const complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
                    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    if (!complete) {
                        gl.deleteRenderbuffer(colorBuffer);
                        gl.deleteFramebuffer(framebuffer);
                        return null;
                    }

                    const target = { framebuffer, colorBuffer, width, height, samples };
                    this.msaaTargets.push(target);
                    return target;
                }

                deleteTargets() {
                    const gl = this.gl;
                    for (const target of this.targets) {
                        gl.deleteFramebuffer(target.framebuffer);
                        gl.deleteTexture(target.texture);
                    }
                    this.targets.length = 0;
                    for (const target of this.msaaTargets) {
                        gl.deleteRenderbuffer(target.colorBuffer);
                        gl.deleteFramebuffer(target.framebuffer);
                    }
                    this.msaaTargets.length = 0;
                    this.sourceMsaaTarget = null;
                    this.msaaSamples = 1;
                }

                resize() {
                    const width = Math.max(1, window.innerWidth);
                    const height = Math.max(1, window.innerHeight);
                    const minimumDpr = width * height <= 3000000 ? 1.25 : 1;
                    const dpr = clamp(Math.max(window.devicePixelRatio || 1, minimumDpr), 1, 2);
                    const pixelWidth = Math.max(1, Math.round(width * dpr));
                    const pixelHeight = Math.max(1, Math.round(height * dpr));
                    if (this.canvas.width === pixelWidth && this.canvas.height === pixelHeight &&
                        this.cssWidth === width && this.cssHeight === height) return;

                    this.cssWidth = width;
                    this.cssHeight = height;
                    this.dpr = dpr;
                    this.canvas.width = pixelWidth;
                    this.canvas.height = pixelHeight;
                    this.deleteTargets();
                    this.sourceTarget = this.createTarget(pixelWidth, pixelHeight);
                    this.discMaskTarget = this.createMaskTarget(pixelWidth, pixelHeight);
                    this.sourceMsaaTarget = this.createMultisampleTarget(pixelWidth, pixelHeight);
                    this.msaaSamples = this.sourceMsaaTarget?.samples || 1;
                    this.downTargets = [];
                    this.upTargets = [];
                    let levelWidth = Math.max(1, Math.floor(pixelWidth / 2));
                    let levelHeight = Math.max(1, Math.floor(pixelHeight / 2));
                    const bloomLogs = Math.log2(Math.max(levelWidth, levelHeight)) + BLOOM_DIFFUSION - 10;
                    const bloomFloor = Math.floor(bloomLogs);
                    const maximumBloomLogs = bloomLogs +
                        Math.log2(BLOOM_RADIUS_CALIBRATION * Math.sqrt(3));
                    const bloomLevels = clamp(Math.ceil(maximumBloomLogs), 1, MAX_BLOOM_LEVELS);
                    this.bloomLogs = bloomLogs;
                    this.activeBloomLevels = clamp(bloomFloor, 1, bloomLevels);
                    this.bloomSampleScale = 0.5 + bloomLogs - bloomFloor;
                    for (let level = 0; level < bloomLevels; level++) {
                        this.downTargets.push(this.createTarget(levelWidth, levelHeight));
                        this.upTargets.push(this.createTarget(levelWidth, levelHeight));
                        if (levelWidth <= 2 || levelHeight <= 2) break;
                        levelWidth = Math.max(1, Math.floor(levelWidth / 2));
                        levelHeight = Math.max(1, Math.floor(levelHeight / 2));
                    }
                    this.engine.resize(width, height);
                }

                bloomParameters(glowControl) {
                    if (glowControl <= 0) {
                        return { levels: 0, sampleScale: 0, radiusScale: 0 };
                    }
                    const radiusScale = BLOOM_RADIUS_CALIBRATION * Math.sqrt(glowControl);
                    const bloomLogs = this.bloomLogs + Math.log2(radiusScale);
                    const bloomFloor = Math.floor(bloomLogs);
                    return {
                        levels: clamp(bloomFloor, 1, this.downTargets.length),
                        sampleScale: 0.5 + bloomLogs - bloomFloor,
                        radiusScale
                    };
                }

                clearTarget(target = null) {
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
                    gl.viewport(0, 0, target ? target.width : this.canvas.width, target ? target.height : this.canvas.height);
                    gl.clearColor(0, 0, 0, 0);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                }

                setAdditiveBlend() {
                    const gl = this.gl;
                    gl.enable(gl.BLEND);
                    gl.blendEquation(gl.FUNC_ADD);
                    gl.blendFunc(gl.ONE, gl.ONE);
                }

                setPremultipliedBlend() {
                    const gl = this.gl;
                    gl.enable(gl.BLEND);
                    gl.blendEquation(gl.FUNC_ADD);
                    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
                }

                drawSprite(texture, x, y, width, height, rotation, color, alpha, gain, uvRect = [0, 0, 1, 1]) {
                    if (width <= 0.02 || height <= 0.02 || alpha <= 0.0001) return;
                    const gl = this.gl;
                    const program = this.spriteProgram;
                    gl.useProgram(program);
                    gl.bindVertexArray(this.spriteVao);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, "uTexture"), 0);
                    gl.uniform2f(gl.getUniformLocation(program, "uCenter"), x, y);
                    gl.uniform2f(gl.getUniformLocation(program, "uSize"), width, height);
                    gl.uniform2f(gl.getUniformLocation(program, "uResolution"), this.cssWidth, this.cssHeight);
                    gl.uniform4f(gl.getUniformLocation(program, "uUvRect"), ...uvRect);
                    gl.uniform1f(gl.getUniformLocation(program, "uRotation"), rotation);
                    const linear = linearColor(color);
                    gl.uniform3f(gl.getUniformLocation(program, "uColor"), linear[0], linear[1], linear[2]);
                    gl.uniform1f(gl.getUniformLocation(program, "uAlpha"), clamp(alpha * this.engine.opacity, 0, 1));
                    gl.uniform1f(gl.getUniformLocation(program, "uGain"), gain);
                    gl.drawArrays(gl.TRIANGLES, 0, 6);
                }

                drawGeometry(texture, vertices, gain) {
                    if (vertices.length < 24) return;
                    const gl = this.gl;
                    const program = this.geometryProgram;
                    gl.useProgram(program);
                    gl.bindVertexArray(this.geometryVao);
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.geometryBuffer);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.DYNAMIC_DRAW);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, "uTexture"), 0);
                    gl.uniform2f(gl.getUniformLocation(program, "uResolution"), this.cssWidth, this.cssHeight);
                    gl.uniform1f(gl.getUniformLocation(program, "uGain"), gain);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, vertices.length / 8);
                }

                pushGeometryVertex(vertices, x, y, u, v, color, alpha) {
                    const linear = linearColor(color);
                    vertices.push(x, y, u, v, linear[0], linear[1], linear[2], clamp(alpha * this.engine.opacity, 0, 1));
                }

                meshAngularVelocity(p, blend) {
                    const min = evalCurve(PROFILE.mesh.rotationMin, p, 1);
                    const max = evalCurve(PROFILE.mesh.rotationMax, p, 0.8);
                    return lerp(min, max, blend) * PROFILE.mesh.rotationScalar;
                }

                meshRotation(p, blend) {
                    const steps = 24;
                    const h = p / steps;
                    let integral = this.meshAngularVelocity(0, blend) + this.meshAngularVelocity(p, blend);
                    for (let index = 1; index < steps; index++) {
                        integral += this.meshAngularVelocity(index * h, blend) * (index % 2 === 0 ? 2 : 4);
                    }
                    return -integral * h / 3 * PROFILE.mesh.lifetimeMs / 1000;
                }

                getDiscState(click, now) {
                    const p = (now - click.born) * this.engine.clickSpeed / PROFILE.disc.lifetimeMs;
                    if (p < 0 || p >= 1) return null;
                    const curve = Math.max(0, evalCurve(PROFILE.disc.sizeCurve, p)) * PROFILE.disc.sizeMultiplier;
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const size = PROFILE.disc.size * this.engine.worldToPx * curve * effectiveScale;
                    const color = this.engine.displayColor(evalColor(PROFILE.disc.color, p));
                    const alpha = evalGradientAlpha(PROFILE.disc.alpha, p);
                    return { size, color, alpha };
                }

                renderDisc(click, now) {
                    const disc = this.getDiscState(click, now);
                    if (!disc) return;
                    this.setPremultipliedBlend();
                    this.drawSprite(
                        this.textures.circle,
                        click.x,
                        click.y,
                        disc.size,
                        disc.size,
                        0,
                        disc.color,
                        disc.alpha,
                        DISC_HDR
                    );
                }

                renderDiscMask(click, now) {
                    const disc = this.getDiscState(click, now);
                    if (!disc) return;
                    this.setPremultipliedBlend();
                    this.drawSprite(
                        this.textures.circle,
                        click.x,
                        click.y,
                        disc.size,
                        disc.size,
                        0,
                        [1, 1, 1],
                        disc.alpha,
                        1
                    );
                }

                renderTriangle(particle, now, speed) {
                    const ageMs = (now - particle.born) * speed;
                    const p = ageMs / particle.lifetimeMs;
                    if (p < 0 || p >= 1) return;
                    const curve = Math.max(0, evalCurve(PROFILE.triangleSize, p));
                    const travelled = particle.speed * ageMs / 1000;
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const radius = particle.localScale * this.engine.worldToPx *
                        (particle.shapeScale + travelled) * effectiveScale;
                    const x = particle.x + Math.cos(particle.direction) * radius;
                    const y = particle.y + Math.sin(particle.direction) * radius;
                    const size = particle.size * particle.localScale * this.engine.worldToPx * curve * effectiveScale;
                    const color = this.engine.displayColor(evalColor(PROFILE.triangleColor, p));
                    const alpha = evalCurve(PROFILE.triangleAlpha, p) * particle.brightness;
                    this.setAdditiveBlend();
                    this.drawSprite(
                        this.textures.triangle,
                        x,
                        y,
                        size,
                        size,
                        0,
                        color,
                        alpha,
                        PARTICLE_HDR,
                        [particle.frame * 0.5, 0, 0.5, 1]
                    );
                }

                renderArc(click, arc, now) {
                    const p = (now - click.born) * this.engine.clickSpeed / PROFILE.mesh.lifetimeMs;
                    if (p < 0 || p >= 1) return;
                    const curve = Math.max(0, evalCurve(PROFILE.mesh.sizeCurve, p));
                    const effectiveScale = this.engine.scale * EFFECT_RENDER_SCALE;
                    const inner = arc.startSize * this.engine.worldToPx * curve * effectiveScale;
                    const outer = inner * PROFILE.mesh.outerRadius;
                    const length = TAU * clamp(1 - evalCurve(PROFILE.mesh.custom, p), 0, 1);
                    if (length < 0.015 || inner <= 0.01) return;
                    const start = arc.angle + this.meshRotation(p, arc.rotationMix);
                    const color = this.engine.displayColor(evalColor(PROFILE.mesh.color, p));
                    const segments = Math.max(2, Math.ceil(64 * length / TAU));
                    const vertices = [];
                    for (let index = 0; index <= segments; index++) {
                        const progress = index / segments;
                        const angle = start + length * progress;
                        const cos = Math.cos(angle);
                        const sin = Math.sin(angle);
                        const u = 1 - progress;
                        this.pushGeometryVertex(vertices, click.x + cos * inner, click.y + sin * inner, u, 0, color, 1);
                        this.pushGeometryVertex(vertices, click.x + cos * outer, click.y + sin * outer, u, 1, color, 1);
                    }
                    this.setAdditiveBlend();
                    this.drawGeometry(this.textures.ring, vertices, PARTICLE_HDR);
                }

                renderTrail(now) {
                    const strokes = this.engine.trailStrokes(now);
                    const halfWidth = TRAIL_WIDTH_WORLD * this.engine.worldToPx *
                        this.engine.trailThickness * TRAIL_RENDER_WIDTH_SCALE * 0.5;
                    if (halfWidth <= 0 || strokes.length === 0) return;
                    this.setAdditiveBlend();
                    for (const sourcePoints of strokes) {
                        const points = smoothTrailPath(
                            sourcePoints,
                            TRAIL_RENDER_SEGMENT_PX / Math.max(1, this.dpr)
                        );
                        const lengths = new Float32Array(points.length);
                        let total = 0;
                        for (let index = 1; index < points.length; index++) {
                            total += Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y);
                            lengths[index] = total;
                        }
                        if (total < 0.05) continue;
                        const vertices = [];
                        const appendPair = (point, nx, ny, offset, progress) => {
                            const color = this.engine.displayColor(evalColor(PROFILE.trailColor, progress));
                            const u = 1 - progress;
                            this.pushGeometryVertex(vertices, point.x + nx * offset, point.y + ny * offset, u, 0, color, 1);
                            this.pushGeometryVertex(vertices, point.x - nx * offset, point.y - ny * offset, u, 1, color, 1);
                        };
                        const segmentNormal = index => {
                            const a = points[index];
                            const b = points[index + 1];
                            const dx = b.x - a.x;
                            const dy = b.y - a.y;
                            const length = Math.max(0.0001, Math.hypot(dx, dy));
                            return { x: -dy / length, y: dx / length, tx: dx / length, ty: dy / length };
                        };

                        const firstNormal = segmentNormal(0);
                        appendPair({
                            x: points[0].x - firstNormal.tx * halfWidth,
                            y: points[0].y - firstNormal.ty * halfWidth
                        }, firstNormal.x, firstNormal.y, halfWidth, 0);
                        appendPair(points[0], firstNormal.x, firstNormal.y, halfWidth, 0);

                        for (let index = 1; index < points.length - 1; index++) {
                            const point = points[index];
                            const progress = lengths[index] / total;
                            const before = segmentNormal(index - 1);
                            const after = segmentNormal(index);
                            let mx = before.x + after.x;
                            let my = before.y + after.y;
                            const miterLength = Math.hypot(mx, my);
                            if (miterLength < 0.0001) {
                                mx = after.x;
                                my = after.y;
                            } else {
                                mx /= miterLength;
                                my /= miterLength;
                            }
                            const alignment = Math.max(0.5, Math.abs(mx * after.x + my * after.y));
                            const offset = Math.min(halfWidth * 2, halfWidth / alignment);
                            appendPair(point, mx, my, offset, progress);
                        }

                        const lastIndex = points.length - 1;
                        const lastNormal = segmentNormal(lastIndex - 1);
                        appendPair(points[lastIndex], lastNormal.x, lastNormal.y, halfWidth, 1);
                        appendPair({
                            x: points[lastIndex].x + lastNormal.tx * halfWidth,
                            y: points[lastIndex].y + lastNormal.ty * halfWidth
                        }, lastNormal.x, lastNormal.y, halfWidth, 1);
                        this.drawGeometry(this.textures.trail, vertices, TRAIL_HDR);
                    }
                }

                renderSource(now) {
                    const gl = this.gl;
                    const renderTarget = this.sourceMsaaTarget || this.sourceTarget;
                    this.clearTarget(renderTarget);
                    gl.disable(gl.DEPTH_TEST);
                    gl.disable(gl.CULL_FACE);
                    this.renderTrail(now);
                    for (const click of this.engine.clicks) this.renderDisc(click, now);
                    for (const click of this.engine.clicks) {
                        for (const arc of click.arcs) this.renderArc(click, arc, now);
                    }
                    for (const particle of this.engine.distanceParticles) {
                        this.renderTriangle(particle, now, this.engine.trailSpeed);
                    }
                    for (const click of this.engine.clicks) {
                        for (const particle of click.triangles) {
                            this.renderTriangle(particle, now, this.engine.clickSpeed);
                        }
                    }
                    this.resolveSourceMultisample();
                }

                renderDiscMasks(now) {
                    const gl = this.gl;
                    this.clearTarget(this.discMaskTarget);
                    gl.disable(gl.DEPTH_TEST);
                    gl.disable(gl.CULL_FACE);
                    for (const click of this.engine.clicks) this.renderDiscMask(click, now);
                }

                resolveSourceMultisample() {
                    if (!this.sourceMsaaTarget) return;
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.sourceMsaaTarget.framebuffer);
                    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.sourceTarget.framebuffer);
                    gl.blitFramebuffer(
                        0,
                        0,
                        this.sourceMsaaTarget.width,
                        this.sourceMsaaTarget.height,
                        0,
                        0,
                        this.sourceTarget.width,
                        this.sourceTarget.height,
                        gl.COLOR_BUFFER_BIT,
                        gl.NEAREST
                    );
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                }

                bindFullscreenTexture(program, name, unit, texture) {
                    const gl = this.gl;
                    gl.activeTexture(gl.TEXTURE0 + unit);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.uniform1i(gl.getUniformLocation(program, name), unit);
                }

                drawFullscreen(program, target) {
                    const gl = this.gl;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
                    gl.viewport(0, 0, target ? target.width : this.canvas.width, target ? target.height : this.canvas.height);
                    gl.useProgram(program);
                    gl.bindVertexArray(this.fullscreenVao);
                    gl.drawArrays(gl.TRIANGLES, 0, 3);
                }

                renderBloom(levelCount, sampleScale) {
                    const gl = this.gl;
                    gl.disable(gl.BLEND);
                    let source = this.sourceTarget;
                    for (let level = 0; level < levelCount; level++) {
                        const target = this.downTargets[level];
                        const program = level === 0 ? this.prefilterProgram : this.downsampleProgram;
                        gl.useProgram(program);
                        this.bindFullscreenTexture(program, "uTexture", 0, source.texture);
                        gl.uniform2f(gl.getUniformLocation(program, "uTexel"), 1 / source.width, 1 / source.height);
                        if (level === 0) gl.uniform1f(
                            gl.getUniformLocation(program, "uThreshold"),
                            BLOOM_THRESHOLD
                        );
                        this.clearTarget(target);
                        this.drawFullscreen(program, target);
                        source = target;
                    }

                    let low = this.downTargets[levelCount - 1];
                    for (let level = levelCount - 2; level >= 0; level--) {
                        const high = this.downTargets[level];
                        const target = this.upTargets[level];
                        const program = this.upsampleProgram;
                        gl.useProgram(program);
                        this.bindFullscreenTexture(program, "uHigh", 0, high.texture);
                        this.bindFullscreenTexture(program, "uLow", 1, low.texture);
                        gl.uniform2f(gl.getUniformLocation(program, "uLowTexel"), 1 / low.width, 1 / low.height);
                        gl.uniform1f(
                            gl.getUniformLocation(program, "uSampleScale"),
                            sampleScale
                        );
                        this.clearTarget(target);
                        this.drawFullscreen(program, target);
                        low = target;
                    }
                    return low;
                }

                render(now) {
                    this.resize();
                    this.engine.prune(now);
                    this.renderSource(now);
                    this.renderDiscMasks(now);
                    const glowControl = clamp(this.engine.glowIntensity, 0, 3);
                    const bloomParameters = this.bloomParameters(glowControl);
                    this.activeBloomLevels = bloomParameters.levels;
                    this.bloomSampleScale = bloomParameters.sampleScale;
                    const bloom = glowControl > 0
                        ? this.renderBloom(bloomParameters.levels, bloomParameters.sampleScale)
                        : this.sourceTarget;
                    const gl = this.gl;
                    gl.disable(gl.BLEND);
                    gl.useProgram(this.finalProgram);
                    this.bindFullscreenTexture(this.finalProgram, "uSource", 0, this.sourceTarget.texture);
                    this.bindFullscreenTexture(this.finalProgram, "uBloom", 1, bloom.texture);
                    this.bindFullscreenTexture(this.finalProgram, "uDiscMask", 2, this.discMaskTarget.texture);
                    gl.uniform1f(
                        gl.getUniformLocation(this.finalProgram, "uBloomStrength"),
                        BLOOM_BASE_STRENGTH * glowControl
                    );
                    gl.uniform2f(
                        gl.getUniformLocation(this.finalProgram, "uBloomTexel"),
                        1 / bloom.width,
                        1 / bloom.height
                    );
                    gl.uniform1f(
                        gl.getUniformLocation(this.finalProgram, "uSampleScale"),
                        bloomParameters.sampleScale
                    );
                    this.clearTarget(null);
                    this.drawFullscreen(this.finalProgram, null);
                }

                clear() {
                    this.clearTarget(null);
                }
            }

            const fallbackAssetBase = "../../apk/.touch_effect_inventory/candidates/textures/";
            const assetNames = {
                circle: "FX_TEX_Circle_01.png",
                ring: "FX_TEX_Grad_Ring3.png",
                trail: "FX_TEX_Trail_03.png",
                triangle: "FX_TEX_Triangle_02_1.png"
            };

            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.decoding = "async";
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error(`Unable to load touch effect asset: ${url}`));
                    image.src = url;
                });
            }

            async function loadAssets() {
                const injected = window.__BASPARK_ASSETS || {};
                const entries = await Promise.all(Object.entries(assetNames).map(async ([key, name]) => {
                    const url = injected[key] || fallbackAssetBase + name;
                    return [key, await loadImage(url)];
                }));
                return Object.fromEntries(entries);
            }

            const canvas = document.getElementById("sparkCanvas");
            const engine = new TouchEngine();
            engine.resize(window.innerWidth, window.innerHeight);
            window.spark = engine;
            window.renderingPaused = false;
            window.currentInputMode = "mouse";
            window.enableAlwaysTrailEffect = false;
            window.effectiveAlwaysTrail = false;
            window.previewReady = false;
            let renderer = null;
            let frameId = null;
            let lastBoom = { x: Number.NaN, y: Number.NaN, time: -Infinity };
            let lastMove = { x: Number.NaN, y: Number.NaN };

            function debugState() {
                const worldToPx = engine.worldToPx;
                return {
                    ready: window.previewReady,
                    backend: renderer ? "webgl2" : "loading",
                    hdr: renderer?.floatTargets ? "rgba16f" : "rgba8",
