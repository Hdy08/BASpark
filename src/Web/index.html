                    window.scheduleNextAnimationFrame(remainingMs);
                    return;
                }

                const deltaMs = Math.min(now - this.lastFrameTime, this.maxDeltaMs);
                this.lastFrameTime = now;

                for (let i = this.clickEffects.length - 1; i >= 0; i--) {
                    const effect = this.clickEffects[i];
                    effect.tMs += deltaMs * this.clickSpeed;
                    if (effect.tMs >= effect.durationMs) {
                        this.clickEffects.splice(i, 1);
                    }
                }

                for (let i = this.distanceEffects.length - 1; i >= 0; i--) {
                    const effect = this.distanceEffects[i];
                    effect.tMs += deltaMs * this.trailSpeed;
                    if (effect.tMs >= effect.durationMs) {
                        this.distanceEffects.splice(i, 1);
                    }
                }

                this.pruneTrail(now);

                const bctx = this.bufferCtx;
                const currentEffectRects = this._getEffectRects();
                const renderRects = this._getRenderRects(currentEffectRects);
                bctx.save();
                this._clipToRects(bctx, renderRects);
                bctx.globalCompositeOperation = "lighter";

                this._clearBufferRects(renderRects);
                if (this.cfg.glowGain > 0 && this.trail.length >= 2) {
                    this._prepareTrailGlowBuffers();
                } else {
                    this.activeTrailGlowRect = null;
                }
                const firstGlowEffect = Math.max(0, this.clickEffects.length - MAX_CLICK_GLOW_EFFECTS);
                for (let i = 0; i < this.clickEffects.length; i++) {
                    this.drawClickEffect(this.clickEffects[i], this.cfg.glowGain > 0 && i >= firstGlowEffect);
                }
                this.drawTrail(now);
                this._compositeTrailGlow();
                for (const effect of this.distanceEffects) {
                    this.renderTriangleLayer(effect.x, effect.y, effect.part, effect.tMs);
                }

                bctx.globalCompositeOperation = "source-over";
                bctx.restore();

                this.previousDirtyRects = currentEffectRects;
                this.forceFullRedraw = false;

                window.scheduleNextAnimationFrame();
            }
        }

        window.spark = new MouseSpark();
        window.renderingPaused = false;
        window.animationFramePending = false;
        window.animationFrameId = null;
        window.animationTimerId = null;

        let lastBoomX = -1, lastBoomY = -1;
        let lastBoomTime = 0;
        let lastMoveX = -1, lastMoveY = -1;

        window.scheduleNextAnimationFrame = (delayMs = 0) => {
            if (window.renderingPaused || !window.spark) {
                return;
            }

            const delay = Number.isFinite(delayMs) ? Math.max(0, delayMs) : 0;
            if (window.animationFramePending) {
                if (delay <= 0 && window.animationTimerId !== null) {
                    clearTimeout(window.animationTimerId);
                    window.animationTimerId = null;
                    window.animationFramePending = false;
                } else {
                    return;
                }
            }

            window.animationFramePending = true;
            const requestFrame = () => {
                window.animationTimerId = null;
                if (window.renderingPaused || !window.spark) {
                    window.animationFramePending = false;
                    return;
                }
                window.animationFrameId = requestAnimationFrame(nextNow => {
                    window.animationFrameId = null;
                    window.animationFramePending = false;
                    window.spark.animationLoops(nextNow);
                });
            };

            if (delay > 1) {
                window.animationTimerId = setTimeout(requestFrame, delay);
            } else {
                requestFrame();
            }
        };

        window.setRenderingPaused = paused => {
            window.renderingPaused = Boolean(paused);
            if (window.renderingPaused) {
                if (window.animationFrameId !== null) {
                    cancelAnimationFrame(window.animationFrameId);
                    window.animationFrameId = null;
                }
                if (window.animationTimerId !== null) {
                    clearTimeout(window.animationTimerId);
                    window.animationTimerId = null;
                }
                window.animationFramePending = false;
                lastBoomX = -1;
                lastBoomY = -1;
                lastMoveX = -1;
                lastMoveY = -1;
                window.spark?.clearEffects();
                return;
            }

            window.scheduleNextAnimationFrame();
        };

        window.currentInputMode = "mouse";
        window.enableAlwaysTrailEffect = false;
        window.effectiveAlwaysTrail = false;

        window.setInputContext = (mode, alwaysTrailEnabled) => {
            window.currentInputMode = mode === "touch" ? "touch" : "mouse";
            window.enableAlwaysTrailEffect = Boolean(alwaysTrailEnabled);
            window.effectiveAlwaysTrail = window.currentInputMode === "mouse" && window.enableAlwaysTrailEffect;
        };

        window.setInputContext("mouse", false);

        window.externalBoom = (percentX, percentY) => {
            if (window.renderingPaused) return;
            const now = Date.now();
            if (percentX === lastBoomX && percentY === lastBoomY && (now - lastBoomTime) < 25) return;
            lastBoomX = percentX;
            lastBoomY = percentY;
            lastBoomTime = now;

            const cx = percentX * window.innerWidth;
            const cy = percentY * window.innerHeight;
            window.spark.pointerDown(cx, cy);
            window.scheduleNextAnimationFrame();
        };

        window.externalMove = (percentX, percentY) => {
            if (window.renderingPaused) return;
            if (percentX === lastMoveX && percentY === lastMoveY) return;
            lastMoveX = percentX;
            lastMoveY = percentY;

            const cx = percentX * window.innerWidth;
            const cy = percentY * window.innerHeight;
            window.spark.pointerMove(cx, cy);
            window.scheduleNextAnimationFrame();
        };

        window.externalTrailStart = (percentX, percentY, pointerDown) => {
            if (window.renderingPaused) return;
            lastMoveX = percentX;
            lastMoveY = percentY;
            const cx = percentX * window.innerWidth;
            const cy = percentY * window.innerHeight;
            window.spark.beginTrailStrokeOnly(cx, cy, pointerDown);
            window.scheduleNextAnimationFrame();
        };

        window.externalUp = () => {
            if (window.renderingPaused) return;
            window.spark.pointerUp();
            window.scheduleNextAnimationFrame();
        };

        window.updateColor = rgbString => {
            if (!window.spark) return;
            window.spark.color = rgbString || DEFAULT_COLOR;
            window.spark.rebuildConfig();
        };

        window.updateEffectSettings = (scale, opacity, trailSpeed, clickSpeed, trailThickness, trailDelay, glowIntensity) => {
            if (!window.spark) return;
            window.spark.scale = Math.max(0.5, Math.min(3, Number(scale) || UI_DEFAULT_SCALE));
            window.spark.opacity = Math.max(0.1, Math.min(1, Number(opacity) || 1.0));
            window.spark.trailThickness = Math.max(0.5, Math.min(3, Number(trailThickness) || 1.0));
            const delay = Number(trailDelay);
            window.spark.trailDelayMs = Math.max(0, Math.min(500, Number.isFinite(delay) ? delay * 1000 : 100));
            const glow = Number(glowIntensity);
            window.spark.glowIntensity = Math.max(0, Math.min(3, Number.isFinite(glow) ? glow : 1.0));
            let t = Number(trailSpeed);
            if (!Number.isFinite(t)) t = 1.0;
            let c = Number(clickSpeed);
            if (!Number.isFinite(c)) c = t;
            window.spark.trailSpeed = Math.max(0.2, Math.min(3, t));
            window.spark.clickSpeed = Math.max(0.2, Math.min(3, c));
            window.spark.rebuildConfig();
        };

        window.updateTrailRefreshRate = hz => {
            if (!window.spark) return;
            const value = Number(hz);
            const refreshHz = Math.max(30, Math.min(360, Number.isFinite(value) ? value : 60));
            window.spark.trailFrameIntervalMs = 1000 / refreshHz;
            window.spark.trailRenderAccumulator = 1.0;
        };
    </script>
</body>
</html>
