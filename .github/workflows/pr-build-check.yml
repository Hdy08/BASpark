name: PR Build Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Web tests
        shell: pwsh
        run: node --test tests/Web/fx-adapter.test.mjs tests/Web/vendor-contract.test.mjs

      - name: Run tests
        shell: pwsh
        run: dotnet test BASpark.sln -c Release --verbosity normal

      - name: Build App
        shell: pwsh
        run: |
          $RAW_VER = "${{ github.ref_name }}".TrimStart("v")
          
          if ("${{ github.event_name }}" -eq 'pull_request') { 
              $PR_NUM = "${{ github.event.pull_request.number }}"
              $RAW_VER = "0.0.0-pr.$PR_NUM" 
          }
          elseif ($RAW_VER -eq "main" -or [string]::IsNullOrWhiteSpace($RAW_VER)) { 
              $RAW_VER = "0.0.0-preview" 
          }
          
          Write-Host "----------------------------------------------"
          Write-Host "Targeting Version: $RAW_VER"
          Write-Host "----------------------------------------------"

          # WinUI 3 (Windows App SDK) + WebView2 both ship native components that
          # cannot be merged into a single-file bundle, so the app publishes as a
          # self-contained folder. WindowsAppSDKSelfContained removes the need for
          # the Windows App Runtime to be installed on the target machine.
          dotnet publish src/BASpark.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishSingleFile=false `
            -p:Version=$RAW_VER `
            -o src/publish_app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASpark-Executable-Preview
          path: src/publish_app/
          retention-days: 7
